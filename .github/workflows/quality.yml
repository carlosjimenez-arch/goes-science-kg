name: GOEs quality

on:
  push:
    branches: [main, feat/api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: API contracts · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --no-deps --disable-pip
      - name: Check source style
        run: |
          uv run --frozen ruff check src tests scripts .claude/hooks
          uv run --frozen ruff format --check src tests scripts .claude/hooks --output-format concise
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check browser modules and out-of-order response handling
        run: |
          for file in src/goes_science_kg/interfaz/estaticos/*.js; do node --check "$file"; done
          node --test tests/js/*.test.cjs
      - name: Run portable contracts without private data or credentials
        run: |
          uv run --frozen pytest -q \
            tests/test_api_operacion.py tests/test_api_interfaz.py tests/test_api_mejoras.py \
            tests/test_mejoras_curriculares.py tests/test_mejoras_entrega.py \
            tests/test_motor.py tests/test_motor_integracion.py tests/test_esquemas_transporte.py \
            tests/test_datos_externos.py tests/test_respaldo_ciencias.py \
            tests/test_embeddings_presupuesto.py tests/test_progresion_v4.py tests/test_sincronizacion.py tests/test_sin_rutas_locales.py \
            tests/test_gitignore.py tests/test_observabilidad_http.py tests/test_metricas_calidad.py \
            --cov=goes_science_kg --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Retain measured test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-python-${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
