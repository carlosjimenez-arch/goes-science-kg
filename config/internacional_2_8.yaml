# Documentos del estudio internacional de 2.°–8.° (spec 12). Mismo formato que config/internacional.yaml (9.°–11.°).
#
# Equivalencia de grados por edad de ingreso (SV 1.° ≈ 7 años; misma regla que la spec 11):
#   Singapur P = SV, Sec 1–2 = SV 7–8 · Japón, Corea, Taiwán y Hong Kong: primaria = SV + 1 (小3 / 초3 / 三年級 = SV 2),
#   secundaria baja 1.°–3.° = SV 6–8 · Inglaterra Year = SV + 2 · Australia Year = SV + 1 · Estonia grado = SV ·
#   Ontario Grade = SV + 1.
# En 2.°–8.° todo es núcleo (obligatorio): no hay especialización.
#
# Documentos marcados «igual que 9_11»: copia exacta de su entrada en config/internacional.yaml (mismo título, curso y
# páginas), así que su extracción ya está en la caché de Vertex y no cuesta nada.

paises:
  SG: {nombre: Singapur, nota: "Primary Science P3–P6 (2023) y Lower Secondary Science G2/G3 (2024)"}
  JP: {nombre: Japón, nota: "小学校・中学校学習指導要領 理科 (2017): objetivos ya extraídos del grafo principal (jp-cos)"}
  KR: {nombre: Corea del Sur, nota: "2022 개정 과학과 교육과정: 초등 3~4, 5~6 y 중학교 1~3학년군"}
  ENG: {nombre: Inglaterra, nota: "National Curriculum KS1–KS3 (2013), ya extraído; Year 10 (SV 8) desde GCSE Combined"}
  AU: {nombre: Australia, nota: "Australian Curriculum v9 F–10, ya extraído del grafo principal"}
  HK: {nombre: Hong Kong, nota: "Science (P1–6) Curriculum Guide (2025, en chino) y Science (S1–3) Curriculum Framework (2025)"}
  TW: {nombre: Taiwán, nota: "十二年國教 自然科學領域: 第二~第四學習階段"}
  EE: {nombre: Estonia, nota: "Põhikool, Annex 4 Natural Science (2023): etapas I–III"}
  "ON": {nombre: Ontario, nota: "Science and Technology Grades 1–8 (2022), Grades 3–8 = SV 2–7, y SNC1W (Grade 9 = SV 8)"}

