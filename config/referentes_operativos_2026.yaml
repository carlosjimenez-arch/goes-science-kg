schema_version: '1.0'
meta:
  clasificacion: parafrasis_del_proyecto
  no_equivalencia: Los IDs son locales; no son códigos oficiales ni acreditan alineación o eficacia.
  fecha_consulta: '2026-10-21'
  alcance: '29 referentes para analizar tareas: 21 de PISA 2025 final y 8 de ERCE 2019 técnico. La cobertura se
    limita a las unidades contadas explícitamente.'
  exhaustividad: por_unidad_no_global
  paginas: Numeración PDF desde 1 incluida portada; los folios impresos pueden diferir.
  procedencia: data/referencias_2026/manifest.json
  documentacion: docs/investigacion/referentes_operativos_2026.md
  limites:
  - Subcompetencia es la etiqueta del proyecto para cada viñeta de desempeño de los recuadros PISA; la fuente no
    les asigna estos IDs.
  - No se incluyen todos los ejemplos de contenido ni los descriptores procedimentales y epistémicos detallados,
    identidad científica o competencias ambientales específicas de PISA.
  - Los cinco dominios y tres procesos ERCE no son todos sus indicadores de construcción de ítems; no se inventan
    los indicadores no publicados aquí.
  - La tabla 2.9 ERCE se verificó como distribución de la prueba, no como pesos para puntuar alineaciones o planificar
    horas de clase.
  - Ancla, edad o grado coincidentes no demuestran que una tarea solicite el desempeño; deben contrastarse consigna,
    respuesta esperada y criterio de evaluación.
  - PISA 2025 se referencia a población nominal de 15 años; ERCE 2019 ciencias a sexto de primaria, sin equivalencia
    automática con edad.
  - Este catálogo no sustituye ni modifica las 22 dimensiones de muestra ni los conjuntos de evaluación congelados.
