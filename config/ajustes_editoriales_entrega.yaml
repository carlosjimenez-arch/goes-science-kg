- item_id: CURRICULO:V4:dbd22ca9611fe2e48ae3fb725c371c7ad3ab8c00adf1449476229ef5e0440ae9
  edicion_previa_sha256: c9f45b1dd1ad32ff5251977168d832caaf52abfdf4614369a84f80fe2d6e8a3c
  ruta: actividades/4/texto
  anterior: 'Distingue h, altura del agua sobre el orificio, de H, altura del orificio sobre donde cae
    el chorro. En el modelo ideal de depósito abierto grande y salida horizontal, v = raíz(2gh); con alcance
    R se estima v = R·raíz(g/(2H)). EJEMPLO SINTÉTICO, no medido: h = 0,20 m, H = 0,80 m, R = 0,80 m y
    g = 9,8 m/s². Compara ambas estimaciones y sus supuestos. En una prueba supervisada registra sólo
    medidas reales y discute viscosidad, pérdidas, descenso del nivel y errores; sin montaje, la ejecución
    queda pendiente.'
  nuevo: 'Distingue h, altura del agua sobre el orificio, de H, altura del orificio sobre donde cae el
    chorro. En el modelo ideal de depósito abierto grande y salida horizontal, v = raíz(2gh); con alcance
    R se estima v = R·raíz(g/(2H)). EJEMPLO SINTÉTICO, no medido: h = 0.20 m, H = 0.80 m, R = 0.80 m y
    g = 9.8 m/s². Compara ambas estimaciones y sus supuestos. En una prueba supervisada registra sólo
    medidas reales y discute viscosidad, pérdidas, descenso del nivel y errores; sin montaje, la ejecución
    queda pendiente.'
  motivo: Ajuste formal al punto decimal declarado en la notación del insumo; no modifica valores. Requiere
