  ruta: actividades/0/texto
  anterior: 'Considera una rueda ideal que gira rígidamente: un punto está a 0,50 m del eje y otro a 0,20
    m; ambos completan una vuelta en el mismo tiempo. Compara sus recorridos por vuelta y predice cuál
    tiene mayor rapidez tangencial. Es una situación de papel: no se enciende ni se acerca el alumnado
    a aspas de ventiladores.'
  nuevo: 'Considera una rueda ideal que gira rígidamente: un punto está a 0.50 m del eje y otro a 0.20
    m; ambos completan una vuelta en el mismo tiempo. Compara sus recorridos por vuelta y predice cuál
    tiene mayor rapidez tangencial. Es una situación de papel: no se enciende ni se acerca el alumnado
    a aspas de ventiladores.'
  motivo: Ajuste formal al punto decimal declarado en la notación del insumo; no modifica valores. Requiere
    relectura de esta edición publicada.
  tipo: notacion_decimal
- item_id: CURRICULO:V4:880b8a38def99a552432b83e5cf649876d6fba46b89e5aec3e5923fe4e87e9f5
