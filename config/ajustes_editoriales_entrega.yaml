- item_id: CURRICULO:V4:ec15fb8efd64a6de697863033a642afe1cc5db7363737b73bfea6adf3d8aee12
  edicion_previa_sha256: 13a61498b5d9e088b858916ae52d436d400ef911a9075135e98a07b655ccfb8e
  ruta: actividades/3/texto
  anterior: 'Justifica elegir un fotocátodo en este MODELO SINTÉTICO del efecto fotoeléctrico externo:
    fotones de energía 2,5 eV, material A con función trabajo 2,0 eV y B con 3,0 eV. Determina cuál permite
    emisión y la energía cinética máxima en el modelo ideal. Explica por qué variar la inclinación cambia
    el flujo recibido, no hf para frecuencia fija. No traslades la función trabajo de este ensayo a la
    brecha de una celda fotovoltaica.'
  nuevo: 'Justifica elegir un fotocátodo en este MODELO SINTÉTICO del efecto fotoeléctrico externo: fotones
    de energía 2.5 eV, material A con función trabajo 2.0 eV y B con 3.0 eV. Determina cuál permite emisión
    y la energía cinética máxima en el modelo ideal. Explica por qué variar la inclinación cambia el flujo
    recibido, no hf para frecuencia fija. No traslades la función trabajo de este ensayo a la brecha de
    una celda fotovoltaica.'
  motivo: Ajuste formal al punto decimal declarado en la notación del insumo; no modifica valores. Requiere
