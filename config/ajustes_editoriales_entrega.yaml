  ruta: actividades/0/texto
  anterior: 'Compara dos detenciones IDEALES de una pelota de espuma de 0,10 kg que se mueve horizontalmente
    a 2,0 m/s: en A se detiene en 0,01 s y en B en 0,10 s. Son datos sintéticos, no pruebas de choque
    reales. Predice en cuál es mayor la fuerza neta media y explica qué se mantiene igual; no se realizan
    choques con personas o huevos ni se valida equipo de protección.'
  nuevo: 'Compara dos detenciones IDEALES de una pelota de espuma de 0.10 kg que se mueve horizontalmente
