  ruta: actividades/2/texto
  anterior: 'Analiza un EJEMPLO SINTÉTICO de lanzamiento horizontal: y inicial 1,000 m, vx inicial 2,0
    m/s, vy inicial 0, g = 9,8 m/s² hacia abajo y sin rozamiento. Para t = 0;0,10;0,20;0,30 s, x = 0;0,20;0,40;0,60
    m e y = 1,000;0,951;0,804;0,559 m. Grafica x-t e y-t, estima velocidades y calcula tiempo de vuelo
    y alcance; son valores ideales, no observaciones. Como variación oblicua, conserva vx e y inicial
    y usa vy inicial 1,0 m/s para predecir cómo cambian tiempo y altura máxima.'
  nuevo: 'Analiza un EJEMPLO SINTÉTICO de lanzamiento horizontal: y inicial 1.000 m, vx inicial 2.0 m/s,
    vy inicial 0, g = 9.8 m/s² hacia abajo y sin rozamiento. Para t = 0;0.10;0.20;0.30 s, x = 0;0.20;0.40;0.60
    m e y = 1.000;0.951;0.804;0.559 m. Grafica x-t e y-t, estima velocidades y calcula tiempo de vuelo
    y alcance; son valores ideales, no observaciones. Como variación oblicua, conserva vx e y inicial
    y usa vy inicial 1.0 m/s para predecir cómo cambian tiempo y altura máxima.'
  motivo: Ajuste formal al punto decimal declarado en la notación del insumo; no modifica valores. Requiere
