version: correcciones-docentes-1
huella_curriculo: 0b92f8016bdae2b12a687bd5b3384c4c8ab9bde538fb5b475fcb3fecb926a78f
filas:
- fila_id: CURRICULO:V4:258bbe61ad0e0fa622d287e4052871520bc08c29f153927300a1879da839829e
  motivo: Completar consignas omitidas por marcadores sin separador; limitar la interpretación de PCR
    y retirar la inferencia directa de fenotipo.
  actividades:
  - fase: explicar
    codigo: E4
    texto: Construye con tarjetas un esquema de ADN diana, cebadores y polimerasa; representa la separación
      de hebras, unión de cebadores y extensión en ciclos. Relaciona el uso de una plantilla y la complementariedad
      con la replicación celular y explica que la PCR es una técnica de amplificación in vitro. Son tarjetas,
      sin realizar una PCR ni diseñar un diagnóstico.
  - fase: indagar
    codigo: D4
    texto: 'Interpreta este registro de PCR didáctico sobre fragmentos sintéticos: control positivo, señal
      de la secuencia diana; control sin ADN, sin señal; muestra A, con señal; muestra B, sin señal. Explica
      qué indica sobre la secuencia diana bajo estas condiciones y qué no demuestra sobre otras secuencias
      o resultados fuera de este ensayo. No se manipulan muestras ni se diagnostica a personas.'
  - fase: reforzar
    codigo: I4
    texto: Critica la afirmación «una señal de PCR demuestra por sí sola el fenotipo de un organismo».
      Distingue detectar o amplificar una secuencia de ADN de explicar su expresión y sus relaciones con
      ambiente y otros genes; identifica información que falta.
  reemplazar_fases:
  - explicar
  producto: Esquema explicado de amplificación de una región diana y registro de interpretación de controles
    y límites de PCR.
- fila_id: CURRICULO:V4:8b1199cce583cc5f360c89c4886ff5b698b3b8c418e55061e2e280aee74a273e
  motivo: Completar actividades no separadas por el lector anterior y distinguir transcripción de traducción.
  producto: Modelo de tarjetas y dos secuencias de ARN con orientación, apareamiento de bases y explicación;
    la tabla del código genético sólo corresponde a una extensión posterior de traducción.
  explicacion_adicional: 'Clave docente para fragmentos idealizados: ADN plantilla 3′-TAC GGA-5′ corresponde
    a ARN 5′-AUG CCU-3′; ADN plantilla 3′-TAC AAA-5′ corresponde a ARN 5′-AUG UUU-3′. La transcripción
    usa complementariedad y orientación antiparalela; una tabla de codones sirve para traducir, no es
    necesaria para obtener el ARN. Son fragmentos didácticos, sin representar un gen completo ni todo
    su procesamiento.'
  actividades:
  - fase: indagar
    codigo: E2
    texto: Representa con tarjetas la transcripción del fragmento de ADN plantilla 3′-TAC GGA-5′ a ARN
      5′-AUG CCU-3′. Relaciona bases, orientación y símbolos con el proceso; explica por qué se usa U
      en ARN y qué límites tiene el modelo.
  - fase: reforzar
    codigo: E1
    texto: A partir del nuevo fragmento de ADN plantilla 3′-TAC AAA-5′, escribe el ARN complementario
      en dirección 5′→3′ y justifica las correspondencias sin copiar el primer ejemplo. Distingue esta
      transcripción de traducir codones a aminoácidos.
- fila_id: CURRICULO:V4:4ba111d1aac0a22dce1c5f1ebb19563e230aa9448eeeae4a2d6c42f24be40fc1
  motivo: Recuperar fases sin marcadores reconocidos y ajustar los códigos a predicción, representación
    y lectura de observaciones.
  reemplazar_todas_actividades: true
  explicacion_adicional: El agua puede pasar de sólido a líquido al recibir energía y congelarse al cederla
    bajo condiciones adecuadas. Aportar energía no implica siempre aumentar la temperatura durante un
    cambio de estado. La situación y las condiciones importan; no todo material cambia del mismo modo.
  seguridad_adicional: Usar sólo hielo y agua a temperatura ambiente sobre bandeja, recipientes plásticos
    y supervisión; no usar agua caliente, llama ni termómetros de vidrio. Las imágenes permiten analizar
    cambios; no acreditan lectura real de un termómetro.
  actividades:
  - fase: explorar
    codigo: E6
    texto: Relaciona un ejemplo cotidiano de hielo que se derrite con una necesidad de conservarlo frío
      en su entorno. Distingue el conocimiento científico empleado de una preferencia o costumbre.
  - fase: explorar
    codigo: E3
    texto: Predice qué le pasará a un cubito de hielo en un recipiente a temperatura ambiente y explica
      una razón antes de observar; conserva su dibujo inicial.
  - fase: explicar
    codigo: E1
    texto: Explica que el hielo puede fundirse al recibir energía del entorno y que enfriar agua suficientemente
      puede congelarla. Usa sólido y líquido para describir el mismo material; no afirma que cualquier
      aumento de temperatura cambie siempre el estado.
  - fase: indagar
    codigo: D4
    texto: Observa un cubito de hielo que se funde en un recipiente plástico con supervisión, o una secuencia
      preparada de imágenes. Registra con dibujos el estado inicial, el intermedio con hielo y agua y
      el final; compara con la predicción sin inventar temperaturas. Si se dispone de termómetro seguro,
      el adulto modela su lectura; el análisis de imágenes se distingue de medir realmente.
  - fase: reforzar
    codigo: E3
    texto: Ante dibujos de agua líquida que se enfría suficientemente y de hielo que recibe energía, predice
      el cambio posible y justifica la condición necesaria. Explica por qué necesita conocer el material
      y las condiciones antes de extender la predicción a otra sustancia.
