# Mallas curriculares del MINED vigentes: Versión 3 (entregada el 2026-10-13; spec 15).
# Fuente única: data/fuentes/mined/Mallas sugeridas v3/  (SOLO LECTURA)
#
# Frente a la V2, la V3 tiene 819 temas idénticos, 21 parecidos, 75 ampliados (fusionan o amplían uno de la V2) y 20
# nuevos; absorbe 136 temas de la V2 en otros y mueve 5 de grado. En 10.°–11.° consolida los temas en clases. La V2
# queda en config/mallas_v2.yaml como referencia (y la V1 en config/mallas_v1.yaml).
#
# Ids estables: un tema de la V3 idéntico o parecido a uno de la V2 conserva el id de la V2 (así las etiquetas,
# revisiones, la capa pedagógica, los dictámenes y las citas siguen apuntando al mismo tema). Un tema nuevo toma su id
# por posición y, si ese id ya existió en la V2 para otro tema, lleva el sufijo «-v3». La correspondencia la escribe
# `gskg malla-correspondencia` en `correspondencia` (determinista, versionada) y la lee `extraer()`.
#
# El archivo de cada malla se fija AQUÍ de forma explícita (no por fecha de modificación).
directorio: data/fuentes/mined/Mallas sugeridas v3
anterior: mallas_v2
version: V3   # prefijo de la llave de los temas nuevos («V3/<archivo>»), que no chocan con las de la V2
correspondencia: data/interim/mallas/v2_a_v3.json
similitud_minima: 0.75   # «parecido»: procedimental con al menos esta similitud con un tema de la V2 del mismo grado
contencion_minima: 0.8   # «ampliado» y «absorbido»: parte de las raíces del tema de la V2 que están en el de la V3

archivos:
  - {archivo: "Matriz_Ciencias_2do_Grado_U1_U6 - V2.xlsx", grado: 2, asignatura: ciencias}
  - {archivo: Matriz_Ciencias_3er_Grado_U1_U6 V2.xlsx, grado: 3, asignatura: ciencias}
  - {archivo: Matriz_Ciencias_4to_Grado_U1_U6 V2.xlsx, grado: 4, asignatura: ciencias}
  - {archivo: Matriz_Ciencias_5to_Grado_U1_U6 V2.xlsx, grado: 5, asignatura: ciencias}
  - {archivo: Matriz_Ciencias_6to_Grado_U1_U6 V2.xlsx, grado: 6, asignatura: ciencias}
  - {archivo: Matriz_Ciencias_7mo_Grado_U1_U6 V2.xlsx, grado: 7, asignatura: ciencias}
  - {archivo: Matriz_Ciencias_8vo_Grado_U1_U10 V2.xlsx, grado: 8, asignatura: ciencias}
  - {archivo: "Matriz_Ciencias_9no_Grado_U1_U12 - V2.xlsx", grado: 9, asignatura: ciencias}
  # Bachillerato: un libro por asignatura; el grado sale del nombre de la hoja («Física 10.°»). Química trae además la
  # columna «N° Clase».
  - {archivo: Matriz_Bachillerato_Fisica_10_11.xlsx, asignatura: fisica}
  - {archivo: Matriz_Bachillerato_Quimica_10_11.xlsx, asignatura: quimica}
  - {archivo: Matriz_Bachillerato_Biologia_10_11.xlsx, asignatura: biologia}

# Columnas de las hojas de unidad. Encabezados en las filas 1 y 2; datos desde la fila 3.
# «Unidad» y «Contenido» vienen en celdas combinadas y se arrastran hacia abajo.
fila_datos: 3
fases_pisa: ["1. Aproximar", "2. Explorar", "3. Explicar", "4. Indagar", "5. Reforzar"]
