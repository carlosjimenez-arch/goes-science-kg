  - item_id: CURRICULO:V4:380e17185a52cb7023e4c3f43913a9aa7cc598b1628d01a37f02279e208e216e
    edicion_base_sha256: a10cbdb04cd40d18a3855ffd69e96d27ac87c64587323fed958e3d0834624edc
    motivo: >-
      Distinguir unidades base y derivadas de los procedimientos de lectura o cálculo,
      sin afirmar que toda magnitud derivada sólo se puede calcular. Precisar una
      tarea realizable en quinto grado. Es una propuesta editorial, no un voto favorable.
    cambios:
      indicador: >-
        1.1. Mide longitud, masa, intervalos de tiempo y volumen con instrumentos
        adecuados, expresa sus resultados en unidades del SI y distingue la lectura
        de una escala del cálculo del área a partir de longitudes.
      producto: >-
        Tabla de magnitudes, valores y unidades que identifica instrumento o
        procedimiento, distingue lecturas de resultados calculados y registra
        la división de la escala y las limitaciones de cada medición.
      explicacion: >-
        Las unidades base y derivadas expresan relaciones entre magnitudes; esa
        clasificación no decide por sí sola si se lee una escala o se calcula un
        resultado. En esta tarea se lee longitud con regla, masa con balanza,
        tiempo con cronómetro y volumen con una probeta adecuada; el área
        rectangular se calcula multiplicando dos longitudes. Para comparar
        registros hay que comunicar magnitud, unidad y procedimiento. La división
        de una escala y la forma de leerla limitan las cifras justificables; no
        convierten una lectura en un valor exacto.
      actividades/1/texto: >-
        Formula con el grupo la pregunta «¿Qué instrumentos permiten medir
        longitud, masa, un intervalo de tiempo y volumen con los recursos del
        aula, y cómo se comunican esas mediciones?». Distingue esta pregunta
        práctica de reconocer las siete magnitudes base en una tabla del SI;
        no exige medirlas todas con recursos escolares.
      actividades/4/texto: >-
        Con supervisión, usa instrumentos escolares adecuados para medir
        longitud y masa de objetos y un intervalo definido de una actividad
        segura del aula, acordando su inicio y final. Lee el volumen de agua
        limpia a temperatura ambiente en una probeta plástica adecuada, desde
        la posición de lectura que indica su escala. Estima un área con
        cuadrícula y calcula el área de un rectángulo a partir de sus dos
        longitudes. Registra magnitud, valor, unidad, instrumento o procedimiento
        y división de la escala cuando corresponda; compara los registros sin
        añadir cifras arbitrarias. La etiqueta de un envase o una fotografía
        sirve para analizar información, no acredita una medición propia.
        Si faltan instrumentos, utiliza datos identificados como sintéticos y
        deja pendiente la ejecución práctica. No uses vidrio ni sustancias
        desconocidas y no bebas el agua del ejercicio.
      caso_resuelto/clave_docente/1: >-
        El área es una magnitud derivada; en este procedimiento rectangular
        se calcula a partir de dos longitudes y no se lee en la regla.
        Que una unidad sea derivada no obliga a obtener siempre la magnitud
        por cálculo: una probeta adecuada permite leer volumen en su escala.
        Hay que identificar el instrumento, el procedimiento y sus limitaciones.
