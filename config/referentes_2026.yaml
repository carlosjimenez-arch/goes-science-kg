recomendaciones:
  - id: EDU_REC_01
    clase: recomendacion_del_proyecto
    texto: Representar resultados observables y relaciones de evidencia además de conceptos.
    fuentes: [pisa_2025_marco_final, timss_2027_marco, erce_2019_marco_y_resultados_ciencias]
  - id: EDU_REC_02
    clase: recomendacion_del_proyecto
    texto: Probar indagación con apoyo según presaberes; no imponer descubrimiento sin guía.
    fuentes: [pedagogia_indagacion_guiada]
  - id: EDU_REC_03
    clase: recomendacion_del_proyecto
    texto: Separar aprobación automática de texto, calibración de ítems y eficacia de aprendizaje.
    fuentes: [ia_items_timss_validacion]
  - id: EDU_REC_04
    clase: recomendacion_del_proyecto
