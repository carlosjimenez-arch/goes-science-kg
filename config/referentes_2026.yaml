# Catálogo de investigación NUEVO. No sustituye config/referentes.yaml.
# La disponibilidad local se verifica en data/referencias_2026/manifest.json.
schema_version: "1.0"
catalog_id: referentes_educativos_2026_10_21
corte: "2026-10-21"
zona_horaria_corte: America/Bogota
memorando: docs/investigacion/educacion.md
estado_catalogo: investigacion_con_ingesta_parcial

politica:
  descargar_automaticamente: false
  texto_fuente_incluido: false
  manifiesto_local: data/referencias_2026/manifest.json
  motivo_sha256_separado: Las huellas documentales y de extracción se fijan en el manifiesto local, sin activar el grafo.
  activacion: Requiere ingesta con procedencia y aprobación técnica de versión.
  grados_equivalentes_sv: null
  motivo_equivalencia_nula: Validar edad, cohorte, años de escolarización y obligatoriedad.
  separar:
    - dato_verificado
    - recomendacion_del_proyecto
    - pendiente
  restricciones:
    - No transformar puntajes entre PISA, TIMSS y ERCE.
    - No tratar un borrador como marco final ni un anuncio como resultado publicado.
    - No inferir participación de un país por su pertenencia a una organización.
    - No inferir cobertura de competencias por coincidencia de temas.
    - No inferir causalidad pedagógica a partir de promedios nacionales.
    - No tratar malla V4 como currículo oficial sin evidencia de aprobación.
    - No promediar un fallo científico crítico con criterios de estilo favorables.

