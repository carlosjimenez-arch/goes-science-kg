    fuentes: [sv_portal_ciencias, fi_curriculo_basico, ee_organizacion_curricular]

pendientes:
  - clase: pendiente
    id: EDU_PENDING_01
    texto: Validar inventario V4, procedencia, archivos completos y estatus frente al currículo oficial.
  - clase: pendiente
    id: EDU_PENDING_02
    texto: Ingerir documentos con hash SHA256, páginas o celdas, derechos y fragmentos de evidencia.
  - clase: pendiente
    id: EDU_PENDING_03
    texto: Obtener marco granular ERCE 2025 antes de asignarle taxonomía o ponderaciones definitivas.
  - clase: pendiente
    id: EDU_PENDING_04
    texto: Revalidar fechas y modalidades curriculares extranjeras; completar traducciones disciplinares.
  - clase: pendiente
    id: EDU_PENDING_05
    texto: Verificar edad de ingreso, edades de cohorte y obligatoriedad antes de mapear grados.
  - clase: pendiente
    id: EDU_PENDING_06
    texto: Conservar el ciclo y la columna de cada dato al ingerir tablas; los valores TIMSS 2023 del catálogo vigente eran correctos y no requieren la corrección propuesta inicialmente en esta investigación.
