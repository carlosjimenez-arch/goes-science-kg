# Currículos de referencia (países). Criterios de selección en specs/03_fuentes_y_referentes.md.
#
# estado:
#   alineado   → objetivos extraídos y alineados con TIMSS 2027 (en el grafo v0)
#   descargado → el documento está en data/fuentes/externos/ pero falta extraer/alinear
#   pendiente  → hay que conseguir el documento (correr la skill fuentes-descargar)
#
# Desempeño verificado (2026-10-05) con los anexos oficiales de TIMSS 2023 (IEA), Ciencias:
#   documentos timss23_res_g4 (Exhibit 2.1.1, 4.° grado) y timss23_res_g8 (Exhibit 2.2.1, 8.° grado).
#   `timss2023_ciencias` = puesto entre los participantes (los sistemas de referencia como Ontario se listan aparte)
#   y puntaje promedio. Falta PISA 2022 (Vol. I, OCDE) para completar la evidencia.
#
# Equivalencia de grados por EDAD DE INGRESO (El Salvador: 1.° grado a los 7 años):
#   Inglaterra Year N → SV grado N−2, mínimo 2 (Years 1–4 = 2.°, Year 5 = 3.°, Year 6 = 4.°; KS3 Years 7–9 = 5.°–7.°; KS4 Years 10–11 = 8.°–9.°)
#   Australia Year N → SV grado N−1 (Foundation–Year 3 = 2.°; Year 7–10 = 6.°–9.°)
#   Japón grado N → SV grado N−1 (primaria 3.°–6.° = 2.°–5.°; secundaria baja 1.°–3.° = 6.°–8.°)
#   Singapur P N → SV N; Uruguay y Colombia: mismo número de grado (1.° de Colombia se cuenta como 2.°).

paises:
  UY:
    nombre: Uruguay
    motivo: Base declarada por el equipo GOES para la nueva currícula; referente regional.
    idioma: es
    estado: alineado
    documentos: [uy_fq3, uy_fq4, uy_fq5, uy_bio3, uy_bio4, uy_bio5, uy_bio6, uy_te3, uy_te4, uy_geo5, uy_fis6, uy_qui6, uy_prog, uy_mcn]
    vacios: ["Física-Química 7.°", "Tierra y Espacio 7.°–9.°"]
  CO:
    nombre: Colombia
    motivo: Referente regional; la malla del MINED ya cita a MEN Colombia.
    idioma: es
    estado: alineado
    documentos: [co_dba, co_ebc]
  SG:
    nombre: Singapur
    motivo: Alto desempeño sostenido en TIMSS y PISA Ciencias.
    timss2023_ciencias: {g4: {puesto: 1, puntaje: 607}, g8: {puesto: 1, puntaje: 606}}
    idioma: en
    estado: alineado
    documentos: [sg_prim, sg_lowsec]
    vacios: ["Secundaria baja (MOE retiró el enlace del Lower Secondary Science Syllabus)",
             "O-Level Biology 6093 / Chemistry 6092 (SEAB devolvía 404 el 2026-10-05)"]
  CL:
    nombre: Chile
    motivo: Referente regional con Objetivos de Aprendizaje por grado.
    timss2023_ciencias: {g4: {puesto: 39, puntaje: 479}, g8: {puesto: 28, puntaje: 455}}
    idioma: es
    estado: pendiente
    documentos: [cl_bc16, cl_bc72m]
    vacios: ["El sitio del Mineduc bloquea la descarga automática: bajar a mano"]
  JP:
    nombre: Japón
    motivo: 3.° en Ciencias de 8.° grado y 6.° en 4.° grado en TIMSS 2023; Course of Study 2017 por grado.
    timss2023_ciencias: {g4: {puesto: 6, puntaje: 555}, g8: {puesto: 3, puntaje: 557}}
    idioma: ja
    estado: alineado
    documentos: [jp_cos_826, jp_cos_836]
    fuente_nota: "Texto oficial del Course of Study 2017 (MEXT) publicado como datos enlazados por jp-cos (github.com/jp-cos)"
  KR:
    nombre: Corea del Sur
    motivo: Alto desempeño en TIMSS y PISA Ciencias.
    timss2023_ciencias: {g4: {puesto: 2, puntaje: 583}, g8: {puesto: 4, puntaje: 545}}
    idioma: en
    estado: pendiente
  EE:
    nombre: Estonia
    motivo: Mejor desempeño europeo en PISA Ciencias; currículo nacional publicado en inglés.
    idioma: en
    estado: pendiente
  ENG:
    nombre: Inglaterra
    documentos: [eng_ks12, eng_ks3, eng_ks4]
    motivo: 5.° lugar en Ciencias de TIMSS 2023 en 4.° y 8.° grado; National Curriculum por año (licencia OGL).
    timss2023_ciencias: {g4: {puesto: 5, puntaje: 556}, g8: {puesto: 5, puntaje: 531}}
    idioma: en
    estado: alineado
  AU:
    nombre: Australia
    motivo: Australian Curriculum (licencia CC BY 4.0). Senior Secondary Biology/Chemistry v8.4 ya es el pivote de 10.°–11.°; falta F–10 Science v9 por grado.
    timss2023_ciencias: {g4: {puesto: 8, puntaje: 550}, g8: {puesto: 13, puntaje: 520}}
    idioma: en
    estado: alineado
    documentos: [au_f6_v9, au_710_v9, au_ss_bio_u13, au_ss_bio_u4, au_ss_chem_u13, au_ss_chem_u4]
  FI:
    nombre: Finlandia
    motivo: Referente europeo histórico de PISA; currículo básico nacional.
    timss2023_ciencias: {g4: {puesto: 10, puntaje: 542}, g8: {puesto: 6, puntaje: 531}}
    idioma: en
    estado: pendiente
  CA-ON:
    nombre: Canadá (Ontario)
    motivo: Alto desempeño en PISA Ciencias; Science and Technology 1–8 (2022) por grado.
    timss2023_ciencias: {g4: {sistema_de_referencia: true, puntaje: 525}}
    idioma: en
    estado: pendiente

# Estándares (no son países pero sirven de referente de prácticas científicas).
estandares:
  NGSS:
    nombre: Next Generation Science Standards (EE. UU.)
    motivo: Prácticas de ciencia e ingeniería y progresiones K–12; ya hay un PDF en la carpeta del MINED.
    estado: descargado
    archivo_local: data/fuentes/mined/Fuentes/Standars Science and Engineering Practices in the NGSS - FINAL 060513.pdf
  ERCE19:
    nombre: ERCE 2019 (UNESCO-LLECE) · Ciencias 6.°
    motivo: Evaluación regional en la que participa América Latina.
    estado: descargado
    documentos: [erce19_niveles, erce19_aportes]
