indicador: Efectúa experimentos que involucren la separación de mezclas.
indicador_procedencia: MINED, programa Ciencia y Tecnología 2.º–6.º, página PDF 48, indicador 2.5 de tercer
  grado. Recuperado como referencia; la celda final original permanece vacía.
producto: Registro individual ilustrado de predicción, método, observación y explicación para dos separaciones
  físicas; lista de cotejo del manejo de materiales durante la ejecución real.
explicacion: Una mezcla reúne materiales que pueden separarse aprovechando diferencias de propiedades
  físicas. Un tamiz deja pasar piezas más pequeñas que sus aberturas y retiene las mayores; se comprueba
  antes con los materiales concretos. Un filtro adecuado puede retener partículas sólidas insolubles al
  pasar agua; no separa por ese mecanismo la sal disuelta ni demuestra que el agua se pueda beber. Observar
  una separación no significa haber creado una sustancia nueva ni haber recuperado todos los componentes
  sin pérdidas.
actividades:
- fase: explorar
  codigo: E3
  texto: Antes de probar, predice qué pasará al pasar por una malla bolitas grandes de papel seco y grava
    limpia de menor tamaño. Dibuja qué quedará arriba y qué pasará; conserva la predicción para contrastarla.
- fase: explicar
  codigo: E2
  texto: Con un dibujo, relaciona el tamaño de los dos materiales y de las aberturas con lo que pasa o
    queda retenido. Contrasta con un esquema de filtración de grava limpia y agua; explica por qué un
    filtro de papel común no retiene la sal ya disuelta.
- fase: indagar
  codigo: D2
  texto: Propón cómo separar el papel y la grava con una malla revisada por el docente y cómo filtrar
    grava limpia en agua fría con un embudo preparado y papel de filtro. Indica qué se recoge, qué se
    mantiene y cómo registrar resultados; sólo ejecuta con los recursos y supervisión indicados.
- fase: indagar
  codigo: D4
  texto: Tras ejecutar ambas separaciones, dibuja y describe qué quedó retenido y qué pasó. Compara con
    tu predicción, explica cada resultado con la propiedad usada y registra pérdidas o dificultades sin
    inventar datos. El docente observa el manejo real; con imágenes sólo se evalúa interpretación, y la
    ejecución queda pendiente.
- fase: reforzar
  codigo: I4
  texto: Critica la afirmación «el agua que sale transparente del filtro ya es potable». Explica qué se
    observó realmente y por qué eso no comprueba ausencia de sustancias disueltas o microorganismos; decide
    que no debe beberse.
seguridad: 'Materiales proporcionados por la escuela: papel seco y malla con bordes protegidos, grava
  limpia revisada, agua fría de grifo, recipientes plásticos y embudo preparado por un adulto; sin cortar
  botellas en clase, polvo, vidrio, reactivos, calor, muestras de ríos ni sustancias desconocidas. Cantidades
  pequeñas sobre bandeja; no ingerir materiales ni agua filtrada, limpiar derrames y manos, no tirar grava
  al desagüe. El docente prueba antes que las aberturas permitan la separación. Si falta un recurso o
  supervisión, se realiza sólo preparación documental y se conserva pendiente el desempeño experimental.'
criterios_especificos:
- Elige el método por una propiedad observable y justifica la elección con un dibujo o explicación oral.
- Ejecuta con supervisión el procedimiento acordado y registra lo que observa, incluidas pérdidas.
- Compara predicción y resultado sin cambiar la predicción inicial ni convertir la transparencia en prueba
  de potabilidad.
