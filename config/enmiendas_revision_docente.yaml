- item_id: CURRICULO:V4:6bff93d86240abec00f7f5b9d880d35c168094d85d3173c07e5a10d16ce1f13e
  edicion_base_sha256: eaf610d1c6242d986e09fb2914f44b3ee7f32e29c27fb1400d8d834e8eef6458
  ruta: actividades/0/texto
  texto: Analiza en papel una afirmación falsa y peligrosa que aconseja mezclar lejía con ácido muriático.
    Sin mezclar, abrir ni manipular esos productos, predice por qué debe evitarse y contrasta el riesgo
    con fichas de seguridad oficiales. La conclusión debe indicar que nunca se realiza esa mezcla.
  justificacion: La situación debe enunciarse como peligrosa y exclusivamente documental, sin convertir
    una predicción en invitación experimental.
  referencias:
  - REVISION:cdc_lejia:captura_web
- item_id: CURRICULO:V4:3dbe1b12e32aeceb26261a9db4b3abc5c668238fe55f1ac23891dae6ae84e039
  edicion_base_sha256: 1b554d4b64ec277e34e95b2b7de50b00b9cae93e9730a6d4bcec94d04cefab16
  ruta: actividades/0/texto
  texto: Considera una planta acuática sumergida que desprende burbujas al iluminarla. Predice cómo podría
    cambiar el conteo con más o menos iluminación y qué condiciones habría que mantener. Contar burbujas
    no identifica por sí solo el gas ni mide directamente la tasa de fotosíntesis.
  justificacion: La premisa faltaba y no es válido identificar oxígeno exclusivamente por el burbujeo.
  referencias: &id001
  - REVISION:harvard_btb:captura_web
  - https://www.usgs.gov/water-science-school/science/dissolved-oxygen-and-water/
- item_id: CURRICULO:V4:3dbe1b12e32aeceb26261a9db4b3abc5c668238fe55f1ac23891dae6ae84e039
  edicion_base_sha256: 1b554d4b64ec277e34e95b2b7de50b00b9cae93e9730a6d4bcec94d04cefab16
  ruta: actividades/2/texto
  texto: 'Diseña con el docente una comparación a tres distancias de una lámpara de pilas: misma planta,
    agua, intervalo de observación y temperatura controlada. Propón repeticiones y forma de registrar
    burbujas por minuto. Si se ejecuta, registra sólo observaciones reales; sin recursos, queda como diseño
    y la experimentación permanece pendiente.'
  justificacion: El código D2 exige diseñar la indagación, además de contar.
  referencias: *id001
- item_id: CURRICULO:V4:b543289b50c8758cd5209d8bcbd9b071b2b0fdac3a4dd3cf7d97c7f87f0d3591
  edicion_base_sha256: 9e67762d54f0963e718788c175d9749e3824c66f68c3b6b153ee33e63c2c0876
  ruta: indicador
  texto: Aplica un modelo cualitativo de Bernoulli a una prueba con aire, construye un dispositivo simple
    y distingue observación, explicación y límites del modelo.
  justificacion: Indicador derivado explícito para una práctica manual coherente y verificable, sin homologar
    una numeración oficial.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:b543289b50c8758cd5209d8bcbd9b071b2b0fdac3a4dd3cf7d97c7f87f0d3591
  edicion_base_sha256: 9e67762d54f0963e718788c175d9749e3824c66f68c3b6b153ee33e63c2c0876
  ruta: producto
  texto: Dispositivo manual con papel, registro de predicción y pruebas, explicación de fuerzas y límites
    de la interpretación; si no se ejecuta, se entrega sólo el diseño y queda pendiente la práctica.
  justificacion: Se mantiene el desempeño práctico como requisito, sin simular su ejecución.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:b543289b50c8758cd5209d8bcbd9b071b2b0fdac3a4dd3cf7d97c7f87f0d3591
  edicion_base_sha256: 9e67762d54f0963e718788c175d9749e3824c66f68c3b6b153ee33e63c2c0876
  ruta: actividades/0/texto
  texto: Considera dos tiras de papel sujetas por arriba y un flujo de aire seco entre ellas. Predice
    si se acercarán, separarán o permanecerán igual y justifica con un modelo cualitativo de presión y
    movimiento del aire. La prueba puede contrariar la predicción.
  justificacion: Dar la situación necesaria sin introducir un secador eléctrico como recurso no verificado.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:b543289b50c8758cd5209d8bcbd9b071b2b0fdac3a4dd3cf7d97c7f87f0d3591
  edicion_base_sha256: 9e67762d54f0963e718788c175d9749e3824c66f68c3b6b153ee33e63c2c0876
  ruta: actividades/1/texto
  texto: Construye con materiales preparados por el docente un dispositivo de dos tiras grandes de papel
    y un soplador manual de aire seco. Representa el flujo y las fuerzas; no se usan aparatos eléctricos,
    atomizadores, líquidos ni soplado con la boca.
  justificacion: Modelo físico de bajo costo, sin circuitos de red o aerosolización.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:b543289b50c8758cd5209d8bcbd9b071b2b0fdac3a4dd3cf7d97c7f87f0d3591
  edicion_base_sha256: 9e67762d54f0963e718788c175d9749e3824c66f68c3b6b153ee33e63c2c0876
  ruta: actividades/2/texto
  texto: Evalúa si las observaciones son compatibles con tu modelo. Repite la prueba conservando distancia,
    orientación y material. Considera que el flujo real no es uniforme y que el movimiento del papel no
    mide directamente la presión ni prueba por sí solo toda la ecuación de Bernoulli.
  justificacion: La práctica no valida universalmente el modelo; demanda D3 sobre diseño e inferencia.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:b543289b50c8758cd5209d8bcbd9b071b2b0fdac3a4dd3cf7d97c7f87f0d3591
  edicion_base_sha256: 9e67762d54f0963e718788c175d9749e3824c66f68c3b6b153ee33e63c2c0876
  ruta: seguridad
  texto: Papel y soportes sin puntas preparados por un adulto, soplador manual de aire seco y espacio
    despejado. Sin electricidad de red, calor, aerosoles, líquidos ni soplado oral. Si no hay recursos
    o supervisión, se trabaja el diseño documental y se conserva pendiente construir y probar el dispositivo.
  justificacion: Condiciones concretas del dispositivo derivado.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:49886401dfedc79d34dd579c1f0b37198311cbeb2904f8b0e23a0b1c2e082356
  edicion_base_sha256: 617fcbcbbf3e98ea7f01cf2fc00e88ab8171019a67983690a848f5622eb6df8c
  ruta: indicador
  texto: 8.3. Interpreta un ensayo cualitativo con levaduras, distingue un cambio de un indicador redox
    de una medición directa de oxígeno y delimita qué evidencia faltaría para cuantificar su demanda.
  justificacion: El azul de metileno es un indicador redox; el cambio de color no cuantifica DBO.
  referencias: &id002
  - REVISION:ucdavis_metileno:captura_web
- item_id: CURRICULO:V4:49886401dfedc79d34dd579c1f0b37198311cbeb2904f8b0e23a0b1c2e082356
  edicion_base_sha256: 617fcbcbbf3e98ea7f01cf2fc00e88ab8171019a67983690a848f5622eb6df8c
  ruta: producto
  texto: Plan con controles, registro real del ensayo si se ejecuta y explicación de las inferencias y
    límites del cambio de color. Un análisis documental se identifica como tal y no acredita la ejecución
    ni una medición de DBO.
  justificacion: Producto verificable sin atribuir una medida que el recurso no proporciona.
  referencias: *id002
- item_id: CURRICULO:V4:49886401dfedc79d34dd579c1f0b37198311cbeb2904f8b0e23a0b1c2e082356
  edicion_base_sha256: 617fcbcbbf3e98ea7f01cf2fc00e88ab8171019a67983690a848f5622eb6df8c
  ruta: explicacion
  texto: El azul de metileno es un indicador redox y puede decolorarse al ser reducido, entre otros procesos
    por actividad celular de levaduras. Su color no es una lectura directa de oxígeno disuelto ni permite
    calcular por sí solo una demanda bioquímica de oxígeno. Se deben comparar condiciones con y sin levadura
    y sin el sustrato, mantener las demás condiciones y discutir explicaciones alternativas. La ecuación
    de respiración aerobia es un modelo de consumo de oxígeno y formación de CO2 y agua; las levaduras
    también pueden fermentar y el colorante no distingue por sí solo todos esos mecanismos.
  justificacion: Separar mecanismos, evidencia observada y alcance analítico.
  referencias: *id002
- item_id: CURRICULO:V4:49886401dfedc79d34dd579c1f0b37198311cbeb2904f8b0e23a0b1c2e082356
  edicion_base_sha256: 617fcbcbbf3e98ea7f01cf2fc00e88ab8171019a67983690a848f5622eb6df8c
  ruta: actividades/3/texto
  texto: Planifica la comparación documental de registros con levadura y azúcar, sin levadura y sin azúcar.
    Describe el color real sólo si se ejecutó un ensayo supervisado; de lo contrario identifica el análisis
    como documental. Interpreta el cambio como señal redox y explica por qué se necesitaría una medición
    independiente de oxígeno para cuantificar su consumo.
  justificacion: Mantener D4 sin convertir decoloración en dato cuantitativo de oxígeno.
  referencias: *id002
- item_id: CURRICULO:V4:49886401dfedc79d34dd579c1f0b37198311cbeb2904f8b0e23a0b1c2e082356
  edicion_base_sha256: 617fcbcbbf3e98ea7f01cf2fc00e88ab8171019a67983690a848f5622eb6df8c
  ruta: actividades/4/texto
  texto: Critica la conclusión de que un líquido incoloro prueba una concentración exacta de oxígeno o
    de DBO. Localiza qué permiten comparar los controles y qué no distinguen; propone qué medición independiente
    faltaría, sin inventar resultados.
  justificacion: I4 debe cuestionar una inferencia explícita y delimitada.
  referencias: *id002
- item_id: CURRICULO:V4:49886401dfedc79d34dd579c1f0b37198311cbeb2904f8b0e23a0b1c2e082356
  edicion_base_sha256: 617fcbcbbf3e98ea7f01cf2fc00e88ab8171019a67983690a848f5622eb6df8c
  ruta: seguridad
  texto: Esta preparación usa el ensayo con colorante como análisis documental; no autoriza manipularlo
    sin un protocolo docente específico de cantidades, concentración, protección y residuos. No se sopla
    ni se ingieren soluciones, no se usan muestras de ríos ni cultivos desconocidos. La experimentación
    del objetivo queda pendiente cuando no hay recursos y condiciones verificadas.
  justificacion: No publicar un protocolo químico incompleto como ejecución autorizada.
  referencias: *id002
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: indicador
  texto: 8.4. Compara el cambio de oxígeno disuelto en condiciones de luz y oscuridad con planta y controles
    sin planta, mediante un método de medición válido y condiciones comparables.
  justificacion: Conservar el objetivo de oxígeno sin usar un indicador de pH como medida directa.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: producto
  texto: Diseño de cuatro condiciones y tabla de oxígeno disuelto con interpretación de controles, limitaciones
    y respuesta a la afirmación inicial. Si se analiza sólo el ejemplo sintético o imágenes, se declara
    pendiente la ejecución y no se presentan como mediciones reales.
  justificacion: Distinguir desempeño documental de experimental y datos sintéticos de observados.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: explicacion
  texto: 'La fotosíntesis consume CO2 y produce oxígeno; las plantas también respiran tanto en luz como
    en oscuridad. Un sensor de oxígeno disuelto permite observar cambios netos que dependen además de
    temperatura e intercambio con el aire y requieren controles. El azul de bromotimol es un indicador
    ácido-base: un cambio de color puede ser compatible con cambios de CO2 y pH bajo condiciones controladas,
    pero no mide directamente oxígeno ni demuestra su identidad. No se atribuye al gas un resultado obtenido
    sólo por color.'
  justificacion: La relación metabólica no convierte el indicador ácido-base en sensor de oxígeno.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: actividades/1/texto
  texto: 'Predice cómo puede variar el oxígeno disuelto en cuatro condiciones: con planta en luz, con
    planta en oscuridad y controles sin planta en luz y oscuridad. Explicita que las plantas respiran
    en ambas condiciones y que la fotosíntesis depende de la iluminación y otras variables.'
  justificacion: Predicción E3 centrada en la magnitud del objetivo.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: actividades/2/codigo
  texto: E3
  justificacion: Mantener la predicción explícita además de la representación del modelo.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: actividades/2/texto
  texto: Representa con ecuaciones la fotosíntesis y la respiración aerobia, identifica entradas y salidas
    de CO2 y O2 y predice el sentido del cambio neto de oxígeno cuando cambia la luz, indicando los supuestos.
  justificacion: E3 requiere predicción además de representación.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: actividades/3/texto
  texto: 'Diseña con el docente cuatro condiciones con igual agua, volumen, temperatura y duración, variando
    luz y presencia de planta. Registra oxígeno disuelto con un instrumento apropiado, verificado según
    su manual y la temperatura. Si no está disponible, analiza este ejemplo SINTÉTICO ideal en mg/L, no
    observado: inicio 6 en las cuatro condiciones; final con planta/luz 7, con planta/oscuridad 5 y ambos
    controles sin planta 6. Compara cambios y límites; el ejemplo no acredita medición ni experimentación.'
  justificacion: Se ofrece información usable sin inventar observaciones y una vía de ejecución condicionada
    a instrumentos.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: actividades/4/texto
  texto: Critica la afirmación de que las plantas sólo producen oxígeno y nunca liberan CO2. Usa el modelo
    de fotosíntesis y respiración y distingue lo que mide el sensor, lo que sólo sugiere un indicador
    de pH y lo que no puede concluirse de un ejemplo sintético.
  justificacion: Evaluar una inferencia concreta sin confundir magnitudes.
  referencias: *id001
- item_id: CURRICULO:V4:fe2c755c00d1dcf1febeb32b1b07cc81c470ba8b72ecac36b51de73b2673b057
  edicion_base_sha256: b968df2fe653e5b724b70defd0887bfd7f8ffb314a546fb1cadf3bc5dc091d94
  ruta: seguridad
  texto: La ejecución requiere un docente, instrumento de oxígeno disuelto y temperatura verificados según
    su manual, recipientes plásticos, planta de procedencia escolar y fuente de luz adecuada sin calentamiento.
    No se sopla en soluciones, no se usan reactivos, llama, vidrio o tensión de red por el alumnado, ni
    se liberan plantas al ambiente. Sin recursos o condiciones verificadas se realiza sólo el análisis
    documental y la ejecución queda pendiente.
  justificacion: Condiciones de uso concretas, sin fingir disponibilidad de sensores.
  referencias: *id001
- item_id: CURRICULO:V4:1cc4666d6722c6b05d652022fad190ad4b7e0c8e9e3dd417e5e2659769a22a0f
  edicion_base_sha256: 68b88237b610e1ff684bdb54255ed505ebd9c30ab826714d1ed8e25adc65ca82
  ruta: actividades/3/texto
  texto: 'Compara este EJEMPLO SINTÉTICO en mm, sin atribuirlo a instrumentos reales: referencia del ejercicio
    100; serie A 103;103;103;103;103 y serie B 99;100;101;99;101. Compara dispersión y cercanía a la referencia,
    sin certificar calibración. Si realiza mediciones, usa una referencia e información de incertidumbre
    apropiadas; el tamaño nominal de una hoja no es un patrón certificado.'
  justificacion: Distinguir referencia didáctica, sesgo aparente, dispersión y trazabilidad metrológica.
  referencias:
  - https://www.itl.nist.gov/div898/handbook/mpc/section1/mpc113.htm
- item_id: CURRICULO:V4:9b39278f2cf49502e3e6ce80ca17a055150b0d815ee08a7991eaa37f4d90d926
  edicion_base_sha256: 4cb71ad08713cbe9ec274a21e313bc8802402a917fc75e71f3b92ddf1183d980
  ruta: explicacion
  texto: En el modelo de campo magnético uniforme y estático, la fuerza es F = q(v × B). Es perpendicular
    a v y B cuando no es nula; con v paralela a B es cero. Para una carga negativa se invierte el sentido
    obtenido con la regla de la mano derecha para carga positiva. Sin otras fuerzas, no modifica la rapidez.
    En el régimen no relativista, r = m·v_perpendicular/(|q|·B) y T = 2πm/(|q|·B); una componente paralela
    produce avance helicoidal.
  justificacion: Condiciones y signo de la fuerza; no confundir con ley de Ampère.
  referencias:
  - https://openstax.org/books/university-physics-volume-2/pages/11-3-motion-of-a-charged-particle-in-a-magnetic-field
- item_id: CURRICULO:V4:d159505c2df8d1007e0237bdc6feddede9092f072e4314884dceeec012b28de3
  edicion_base_sha256: 38c29e813e0546ae405ab39c38b07440e28dd8783c0b2800ca152889ddac205a
  ruta: actividades/3/texto
  texto: 'Analiza un modelo comparativo a temperatura constante: un gas reduce apreciablemente su volumen
    al aumentar la presión; en agua líquida y un sólido compacto el cambio es mucho menor en el rango
    escolar. Si se usa arena, distingue el cierre de huecos con aire de la compresión de cada grano. No
    deduzcas la compresibilidad del sólido sólo del desplazamiento de arena en una jeringa ni fuerces
    recipientes tapados.'
  justificacion: Evitar inferencia falsa de compresibilidad y una práctica de presión sin protocolo.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/1-2-phases-and-classification-of-matter
- item_id: CURRICULO:V4:ca9cd716b53ffee5300511b9b382795c257b32960551d5699ceac8c131e30c47
  edicion_base_sha256: f110b0773f88a4f399bfe5f090bbd28182d591e9820e527c681429bd07fbb708
  ruta: actividades/3/texto
  texto: 'Analiza este MODELO SINTÉTICO, no un experimento observado: a la misma temperatura y composición
    inicial, sin catalizador se alcanza 10 % de conversión del ácido inicial en un tiempo breve y con
    un catalizador ideal 35 % en el mismo intervalo; tras suficiente tiempo ambas condiciones llegan al
    mismo 60 % de equilibrio. Un tercer caso con exceso inicial de alcohol llega a 80 %. Explica qué comparación
    informa sobre rapidez y cuál sobre composición de equilibrio, sin atribuir al catalizador por sí solo
    un cambio de K. No se ejecuta la síntesis.'
  justificacion: El catalizador acelera alcanzar el equilibrio, no cambia su posición por sí solo; los
    valores son ilustrativos.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/13-summary
- item_id: CURRICULO:V4:4ee5babedae56b315b4019a7ff2d8972e944f2914b2fabb87ac4480cbedbd0fd
  edicion_base_sha256: 48060ef4870300d73f16489c15eb0bb5ec6b5c66acc5e2b33b20223360eed101
  ruta: actividades/1/texto
  texto: 'Lee esta ficha informativa: ante calor intenso, confusión, alteración de conciencia o dificultad
    para hablar son señales de alarma que exigen avisar inmediatamente a un adulto y activar ayuda de
    emergencia según el protocolo del centro. Puede haber piel seca o sudoración; no se descarta el peligro
    por observar sudor. La actividad no diagnostica ni sustituye atención sanitaria y nunca provoca exposición
    al calor para comprobar síntomas.'
  justificacion: Evitar falsa regla de ausencia de sudor y enseñar búsqueda de ayuda, sin ensayar exposición
    ni diagnóstico.
  referencias:
  - https://www.cdc.gov/niosh/heat-stress/about/illnesses.html
  - https://www.osha.gov/heat-exposure/illness-first-aid/
- item_id: CURRICULO:V4:50ef3313bbb1d679373173d0549f8acb4ca2fb213c5221a8b7e0adb3e1776a4b
  edicion_base_sha256: 4ab81c409e407076ddfce5237457ab7e4389ef341f51b17c8a203abaffada8ad
  ruta: actividades/0/texto
  texto: 'Considera una rueda ideal que gira rígidamente: un punto está a 0,50 m del eje y otro a 0,20
    m; ambos completan una vuelta en el mismo tiempo. Compara sus recorridos por vuelta y predice cuál
    tiene mayor rapidez tangencial. Es una situación de papel: no se enciende ni se acerca el alumnado
    a aspas de ventiladores.'
  justificacion: Premisa autosuficiente y segura para comparar radios y rapidez.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/6-1-rotation-angle-and-angular-velocity
- item_id: CURRICULO:V4:76eb021b4a9af53a97e51bf49f582af2a6b28d50a8d6d4844a7f2f7034472177
  edicion_base_sha256: 0e2279bf2070579c49245b420f9467cb07b101deb5d172fce9adc47fd2f1e5d0
  ruta: actividades/1/texto
  texto: 'Interpreta este EJEMPLO SINTÉTICO de tres periodos, en unidades relativas: demanda 10;12;14
    y disponibilidad 15;13;11. Representa las dos series y señala en cuál periodo registrado la demanda
    supera la disponibilidad. No atribuyas los datos a una comunidad salvadoreña ni inventes una fecha
    exacta del cruce entre registros.'
  justificacion: Datos disponibles y honestidad sobre contexto e interpolación.
  referencias:
  - https://www.mined.gob.sv/
- item_id: CURRICULO:V4:880b8a38def99a552432b83e5cf649876d6fba46b89e5aec3e5923fe4e87e9f5
  edicion_base_sha256: de76d1b5822aa8273b5bc75ef5206d9887bd81aed580fa9a4ec7147dc72b613c
  ruta: actividades/0/texto
  texto: 'Compara dos detenciones IDEALES de una pelota de espuma de 0,10 kg que se mueve horizontalmente
    a 2,0 m/s: en A se detiene en 0,01 s y en B en 0,10 s. Son datos sintéticos, no pruebas de choque
    reales. Predice en cuál es mayor la fuerza neta media y explica qué se mantiene igual; no se realizan
    choques con personas o huevos ni se valida equipo de protección.'
  justificacion: Proporcionar una premisa numérica segura sin inventar video o ensayo.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/8-2-impulse
- item_id: CURRICULO:V4:c71e56e7df0f696f63fe3d1e09b70463c3d254f62167b61534d14a24ca21f9ae
  edicion_base_sha256: 41484dd92e8eda8ae4339e8b222e35d46e2faf9d519a0c8eda3306cf7dbba004
  ruta: actividades/2/texto
  texto: 'Analiza dos situaciones IDEALES, sin resistencia del aire: A, desde igual altura, una esfera
    se deja caer y otra se lanza horizontalmente al mismo tiempo; compara sus movimientos verticales y
    horizontales. B, un móvil mantiene la rapidez al cambiar de dirección: dibuja dos vectores velocidad
    antes y después y su diferencia. Explica por qué B tiene aceleración aunque no cambie la rapidez.'
  justificacion: Descripción disponible, independencia de componentes y cambio vectorial de velocidad.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/3-4-projectile-motion
- item_id: CURRICULO:V4:fffe85389a73efc25aa0b69981ce979f0cbe87baf61215c7a6c7c743fa4eb88d
  edicion_base_sha256: 8c556be31861420ba401ae33e40a568371b8e9643c7ee3e7f1e53f32898c37e7
  ruta: actividades/2/texto
  texto: 'Analiza un EJEMPLO SINTÉTICO de lanzamiento horizontal: y inicial 1,000 m, vx inicial 2,0 m/s,
    vy inicial 0, g = 9,8 m/s² hacia abajo y sin rozamiento. Para t = 0;0,10;0,20;0,30 s, x = 0;0,20;0,40;0,60
    m e y = 1,000;0,951;0,804;0,559 m. Grafica x-t e y-t, estima velocidades y calcula tiempo de vuelo
    y alcance; son valores ideales, no observaciones. Como variación oblicua, conserva vx e y inicial
    y usa vy inicial 1,0 m/s para predecir cómo cambian tiempo y altura máxima.'
  justificacion: Tabla autosuficiente con condiciones, unidades y variación; no remitir a un video ausente.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/3-4-projectile-motion
- item_id: CURRICULO:V4:fffe85389a73efc25aa0b69981ce979f0cbe87baf61215c7a6c7c743fa4eb88d
  edicion_base_sha256: 8c556be31861420ba401ae33e40a568371b8e9643c7ee3e7f1e53f32898c37e7
  ruta: producto
  texto: Tabla y gráficas del ejemplo sintético con cálculo razonado de alcance, altura y tiempo para
    los dos lanzamientos ideales; si se hace un registro real posterior, se presenta por separado con
    su método y limitaciones.
  justificacion: Separar modelo didáctico de datos experimentales.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/3-4-projectile-motion
- item_id: CURRICULO:V4:fad0ee817f8fc259ac9a9144363f7d3834b631098d46297c6a98bbefd5a06a81
  edicion_base_sha256: c3043e6832d4932b9b0db8a1b3459661e1fc908a5f3802b74d7e0da5f7ac066b
  ruta: actividades/0/texto
  texto: 'Lee dos fichas SINTÉTICAS: A, lava fluida avanza y se observa poca ceniza; B, se expulsan fragmentos
    y una columna abundante de ceniza. Describe diferencias sin atribuir las fichas a un volcán o fecha
    real. La observación se hace en papel, sin acercarse a erupciones.'
  justificacion: Proveer el contenido de las fichas sin inventar imágenes o hechos locales.
  referencias:
  - https://www.usgs.gov/programs/VHP
- item_id: CURRICULO:V4:fad0ee817f8fc259ac9a9144363f7d3834b631098d46297c6a98bbefd5a06a81
  edicion_base_sha256: c3043e6832d4932b9b0db8a1b3459661e1fc908a5f3802b74d7e0da5f7ac066b
  ruta: actividades/3/texto
  texto: Clasifica las fichas A y B ya descritas como ejemplos efusivo y explosivo, justificando con las
    características observables. Explica que dos ejemplos no cubren todos los tipos de erupción ni permiten
    predecir la actividad de un volcán real.
  justificacion: Actividad autosuficiente con límites de la clasificación.
  referencias:
  - https://www.usgs.gov/programs/VHP
- item_id: CURRICULO:V4:dbd22ca9611fe2e48ae3fb725c371c7ad3ab8c00adf1449476229ef5e0440ae9
  edicion_base_sha256: 0d82f0d1ac20997695b2e46e2da571f4d49189acc5126516ae07c4ca8a7c8202
  ruta: actividades/4/texto
  texto: 'Distingue h, altura del agua sobre el orificio, de H, altura del orificio sobre donde cae el
    chorro. En el modelo ideal de depósito abierto grande y salida horizontal, v = raíz(2gh); con alcance
    R se estima v = R·raíz(g/(2H)). EJEMPLO SINTÉTICO, no medido: h = 0,20 m, H = 0,80 m, R = 0,80 m y
    g = 9,8 m/s². Compara ambas estimaciones y sus supuestos. En una prueba supervisada registra sólo
    medidas reales y discute viscosidad, pérdidas, descenso del nivel y errores; sin montaje, la ejecución
    queda pendiente.'
  justificacion: Restituir la expresión omitida y las condiciones necesarias para comparar rapidez teórica
    y experimental.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:dbd22ca9611fe2e48ae3fb725c371c7ad3ab8c00adf1449476229ef5e0440ae9
  edicion_base_sha256: 0d82f0d1ac20997695b2e46e2da571f4d49189acc5126516ae07c4ca8a7c8202
  ruta: seguridad
  texto: La ejecución requiere montaje docente con agua limpia en bandeja, recipiente sin presión y orificios
    preparados por un adulto, sin vidrio, calor, electricidad ni herramientas cortantes por el alumnado.
    No dirigir chorros a personas. Verificar estabilidad y recoger derrames. Sin recursos o supervisión,
    usar únicamente el ejemplo sintético como análisis y conservar pendiente la experimentación.
  justificacion: Precisar condiciones sin autorizar fabricación peligrosa ni inventar ejecución.
  referencias:
  - https://openstax.org/books/college-physics-2e/pages/12-2-bernoullis-equation
- item_id: CURRICULO:V4:ec15fb8efd64a6de697863033a642afe1cc5db7363737b73bfea6adf3d8aee12
  edicion_base_sha256: fd89a9b4ccfb8e737634606490fd03d735d5d95629f873537c38737106879753
  ruta: actividades/3/texto
  texto: 'Justifica elegir un fotocátodo en este MODELO SINTÉTICO del efecto fotoeléctrico externo: fotones
    de energía 2,5 eV, material A con función trabajo 2,0 eV y B con 3,0 eV. Determina cuál permite emisión
    y la energía cinética máxima en el modelo ideal. Explica por qué variar la inclinación cambia el flujo
    recibido, no hf para frecuencia fija. No traslades la función trabajo de este ensayo a la brecha de
    una celda fotovoltaica.'
  justificacion: No confundir función trabajo, brecha energética, energía por fotón e irradiancia.
  referencias:
  - https://openstax.org/books/university-physics-volume-3/pages/6-2-photoelectric-effect
- item_id: CURRICULO:V4:ec15fb8efd64a6de697863033a642afe1cc5db7363737b73bfea6adf3d8aee12
  edicion_base_sha256: fd89a9b4ccfb8e737634606490fd03d735d5d95629f873537c38737106879753
  ruta: explicacion
  texto: 'En el modelo del efecto fotoeléctrico externo, hf es la energía del fotón, φ la función trabajo
    y K_máxima = hf − φ cuando hf alcanza o supera el umbral; por debajo no hay emisión en el modelo de
    un fotón. A frecuencia fija, aumentar el flujo no aumenta la energía individual hf. La orientación
    del receptor modifica el flujo incidente. Una celda fotovoltaica implica generación y separación de
    portadores en un semiconductor: su brecha energética no se sustituye sin más por la función trabajo
    del experimento externo. Los materiales A y B del ejercicio son hipotéticos, no especificaciones de
    fabricación.'
  justificacion: Distinguir modelos y límites de transferencia tecnológica.
  referencias:
  - https://openstax.org/books/university-physics-volume-3/pages/6-2-photoelectric-effect
- item_id: CURRICULO:V4:9b39278f2cf49502e3e6ce80ca17a055150b0d815ee08a7991eaa37f4d90d926
  edicion_base_sha256: 4cb71ad08713cbe9ec274a21e313bc8802402a917fc75e71f3b92ddf1183d980
  ruta: actividades/0/texto
  texto: En el modelo ideal, un haz de electrones se mueve en la dirección +x y entra en un campo magnético
    uniforme en +z. Dibuja los ejes y predice la dirección inicial de la fuerza usando v × B e invirtiendo
    el sentido por la carga negativa. Contrasta con una carga positiva y con un haz paralelo a B. No se
    construye un haz real.
  justificacion: Proporcionar direcciones suficientes para una predicción determinada y contrastar signo
    y caso límite.
  referencias:
  - https://openstax.org/books/university-physics-volume-2/pages/11-3-motion-of-a-charged-particle-in-a-magnetic-field
- item_id: CURRICULO:V4:542df83271bc9a6ba886141fcbf623e965e8fe4409e3a834d78b5febbd390d73
  edicion_base_sha256: d3bca8f038b19dbcbcf0cf8914375914e9ff464d0e174abbbe0350cc809dde14
  ruta: indicador
  texto: Deduce la formación y la carga de iones monoatómicos a partir de ganancia o pérdida de electrones,
    conservando la identidad del elemento.
  justificacion: Indicador derivado sin atribuir otra numeración oficial ni confundirlo con electrización
    macroscópica.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/2-3-atomic-structure-and-symbolism
- item_id: CURRICULO:V4:74652d196e3abf68ac03a32f564ac3fb7f262ac8efd9a26230456ff2f4a2bb45
  edicion_base_sha256: 231ebe3542ff267443d27b7035ce93d69394238a9e95ead90b25771a18959377
  ruta: actividades/3/texto
  texto: 'Compara estas fichas conceptuales: carbono-12 tiene 6 protones y 6 neutrones y es estable; carbono-14
    tiene 6 protones y 8 neutrones y es radiactivo. Explica por qué ambos son carbono y qué cambia. El
    carbono-14 se usa para datar ciertos restos de origen biológico dentro del rango del método; no permite
    fechar cualquier roca o edad. Sólo se usan fichas, nunca materiales radiactivos.'
  justificacion: Recurso textual disponible y distinción entre identidad elemental, isótopo y aplicación.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/2-3-atomic-structure-and-symbolism
- item_id: CURRICULO:V4:74652d196e3abf68ac03a32f564ac3fb7f262ac8efd9a26230456ff2f4a2bb45
  edicion_base_sha256: 231ebe3542ff267443d27b7035ce93d69394238a9e95ead90b25771a18959377
  ruta: actividades/4/texto
  texto: 'Critica la afirmación «toda radiación es mala y no tiene usos útiles» con el ejemplo documental
    de datación por carbono-14. Explica que un uso útil no vuelve inocua cualquier exposición: los riesgos
    dependen del tipo, dosis y condiciones. No tomes decisiones médicas ni manipules fuentes; contrasta
    la información con una fuente científica.'
  justificacion: I4 requiere crítica de una afirmación explícita con límites, no repetir cálculo de masa
    promedio.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/21-5-uses-of-radioisotopes
- item_id: CURRICULO:V4:801baef4ceef18a46a528d3774e8dd486bd0d154fa3ee8d4e7bf64dd4fa4e92b
  edicion_base_sha256: bf4cc3cb7f3acda525fe681e7c9d6ef8ffd6ab414933305c79d25fd399c29a02
  ruta: actividades/3/texto
  texto: Planifica y, sólo con supervisión, registra la temperatura en recipientes plásticos con hielo
    y distintas cantidades conocidas de sal. Conserva las cantidades de hielo y agua, registra tiempos
    y temperatura ambiente y usa un termómetro apropiado sin vidrio ni mercurio. Grafica cantidad de sal
    y temperatura con unidades. Distingue el cambio transitorio observado de una determinación del punto
    de congelación en equilibrio; una sola demostración no prueba todas las propiedades coligativas. Si
    no se ejecuta, queda pendiente la práctica.
  justificacion: Alinear desempeño sin reducirlo a observar, pero evitando confundir un proceso transitorio
    con equilibrio.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/11-4-colligative-properties
- item_id: CURRICULO:V4:801baef4ceef18a46a528d3774e8dd486bd0d154fa3ee8d4e7bf64dd4fa4e92b
  edicion_base_sha256: bf4cc3cb7f3acda525fe681e7c9d6ef8ffd6ab414933305c79d25fd399c29a02
  ruta: seguridad
  texto: Hielo, sal de uso escolar, recipientes plásticos y termómetro apropiado revisados por el docente.
    Usar bandeja y protección indicada por el centro; evitar contacto prolongado con la mezcla fría, no
    ingerirla ni dirigirla al cuerpo. Sin vidrio, mercurio o calentamiento. Registrar datos sólo de una
    ejecución supervisada; si faltan condiciones, trabajar el diseño documental y mantener pendiente la
    experimentación.
  justificacion: Una mezcla de hielo y sal puede enfriar por debajo de 0 °C y no se trata como inocua
    al contacto.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/11-4-colligative-properties
- item_id: CURRICULO:V4:9d87df726bb43aaa5b06a9c223ab8d60aadba0625c68a605fd6e54699cca179c
  edicion_base_sha256: ef49c21a7fd92c4733e2f723d1cb5da4cf9b7fade30039f0bfe87d89a1ee336e
  ruta: actividades/1/texto
  texto: Predice por separado qué podría cambiar en el tiempo necesario para disolver y en la cantidad
    máxima disuelta al equilibrio cuando varía temperatura o agitación. No presupongas que aumentar temperatura
    aumenta siempre la solubilidad de cualquier sustancia.
  justificacion: Separar magnitudes y evitar una tendencia universal falsa.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/11-3-solubility
- item_id: CURRICULO:V4:9d87df726bb43aaa5b06a9c223ab8d60aadba0625c68a605fd6e54699cca179c
  edicion_base_sha256: ef49c21a7fd92c4733e2f723d1cb5da4cf9b7fade30039f0bfe87d89a1ee336e
  ruta: actividades/2/texto
  texto: Distingue en el modelo escolar con partículas macroscópicas los factores que cambian la rapidez
    de disolución, como agitación y superficie expuesta, de la solubilidad de equilibrio a temperatura
    fija. Explica que la dependencia con temperatura cambia según soluto y disolvente, y que la presión
    es relevante para gases en solución.
  justificacion: Delimitar el modelo sin confundir cinética y equilibrio.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/11-3-solubility
- item_id: UNIDAD-FINAL:6d4115e9d4081fa58970b7d93b19656a243ee8e29bd11aa98800cae57c31606e
  edicion_base_sha256: 5356a23b10fbf7030c3b4bf05709a6c4ec4b4f6ac168f2e58891af4364921a96
  ruta: articulacion
  texto: Conecta disolución, concentración y propiedades de las soluciones mediante representaciones,
    diseño de comparaciones y análisis de datos. Distingue rapidez de disolución de solubilidad al equilibrio
    y observación de una mezcla fría de una determinación completa de propiedades coligativas. Conserva
    los objetivos y declara pendiente toda ejecución que no se haya realizado con recursos y condiciones
    verificadas.
  justificacion: Articulación legible sin aliases efímeros del contexto del revisor.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/11-3-solubility
  - https://openstax.org/books/chemistry-2e/pages/11-4-colligative-properties
- item_id: UNIDAD-FINAL:fa0ec58af7c44c14dfcedc74b621fbf53df67434cc958efbea5f48cc87723440
  edicion_base_sha256: 57f670c961569e433635ec1ad3c1803cec89cadd9abd24e073e02465d6cc9d01
  ruta: articulacion
  texto: 'Relaciona estructura atómica, formación de iones e identidad de los elementos. Diferencia tres
    demandas: deducir carga por cambio de electrones; distinguir isótopos por neutrones y analizar aplicaciones;
    calcular masa atómica promedio con abundancias. Recurre a modelos y evidencias propios de cada objetivo
    y no infiere progreso observado por repetir códigos.'
  justificacion: Separar objetivos y evitar duplicaciones, sin referir a IDs internos del lote.
  referencias:
  - https://openstax.org/books/chemistry-2e/pages/2-3-atomic-structure-and-symbolism
- item_id: CURRICULO:V4:22042268c75bb41d98c3eea0102261c4728e0d5fce7a5b84ebe516a33ba7a29e
  edicion_base_sha256: 37c77732c24628c6b8a809646e7a59893f96683bf4413154fe0da2e4ec4cd005
  ruta: explicacion
  texto: La cobertura del suelo describe qué se observa en la superficie, como vegetación, agua o áreas
    construidas. El uso describe para qué se destina el territorio, según las categorías de la fuente;
    no son conceptos idénticos. Para comparar dos fechas se revisan fuente, leyenda, escala, resolución
    y superficie de referencia. Un cambio de categoría puede relacionarse con procesos naturales o actividades
    humanas; el mapa por sí solo no prueba una causa concreta. Se analizan posibles consecuencias para
    agua, erosión y biodiversidad con evidencia adicional, sin inventar porcentajes de El Salvador.
  justificacion: Núcleo conceptual pertinente en lugar de un marcador o una generalidad geológica; límites
    de inferencia y datos locales.
  referencias:
  - malla_final:CURRICULO:V4:22042268c75bb41d98c3eea0102261c4728e0d5fce7a5b84ebe516a33ba7a29e
