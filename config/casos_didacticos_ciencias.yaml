casos:
- destino:
    grado: 2
    asignatura: Ciencias
    hoja: Unidad 1 - Materia
    fila: 3
  id: instrumentos_2
  reto: Elegir y usar el instrumento para medir un objeto del aula, explicar qué propiedad mide y registrar
    el resultado.
  contexto: Estación de medición del aula; no se recogen temperatura ni datos personales del alumnado.
  ideas_previas: ¿Con la misma regla podemos conocer lo largo, la masa y la temperatura de un objeto?
    Justifica tu elección.
  datos:
    origen: modelo_didactico_sintetico
    tabla:
    - objeto: lápiz
      propiedad: longitud
      valor: 12
      unidad: cm
    - objeto: borrador
      propiedad: masa
      valor: 25
      unidad: g
    - objeto: agua a temperatura ambiente
      propiedad: temperatura
      valor: 22
      unidad: °C
  consignas:
  - Relaciona cada propiedad con regla, balanza o termómetro y explica por qué.
  - Con instrumento disponible, realiza la medición y registra número, unidad y dibujo.
  - Elige cómo medirías ahora una hoja de una planta sin dañarla.
  clave_docente:
  - 'Regla: longitud; balanza: masa; termómetro: temperatura.'
  - Un número sin propiedad y unidad no comunica por sí solo una medición.
  - Leer una tabla dada permite interpretar medidas, pero no demuestra manipulación del instrumento.
  andamiaje: Mostrar una lectura alineada con el cero y otra desalineada; el niño explica cuál permite
    comparar.
  transferencia: Elegir instrumento para una hoja de otra longitud y explicar qué se conserva del procedimiento.
  seguridad: Objetos inertes, sin vidrio roto, mercurio, agua caliente ni mediciones corporales.
  referencias:
  - mined_primaria
  - pisa_final_2026
- destino:
    grado: 3
    asignatura: Ciencias
    hoja: Unidad 3 - El agua
    fila: 3
  id: agua_global_3
  reto: Representar la proporción de agua dulce y salada y relacionar el océano Pacífico con la costa
    salvadoreña.
  contexto: Mapa y representación del agua del planeta; la proporción global no describe el agua de un
    municipio.
  ideas_previas: Si el planeta tiene tanta agua, ¿toda se puede beber? ¿Dónde se ubica la costa del Pacífico
    en el mapa?
  datos:
    origen: referencia_publicada_redondeada
    fuente: usgs_agua
    porcentaje_agua_dulce: 2.5
    porcentaje_agua_salada_por_complemento: 97.5
    porcentaje_oceanos_mares_bahias: 96.5
    unidades_modelo: 200
  consignas:
  - Ubica los océanos y la costa salvadoreña en el mapa proporcionado.
  - 'Como adaptación del modelo original de cien vasos, usa doscientas marcas: representa cinco de agua
    dulce y ciento noventa y cinco de salada.'
  - Explica por qué agua dulce no significa necesariamente agua segura para beber y relaciona un beneficio
    del océano con una actividad costera.
  clave_docente:
  - 5/200 = 2.5%; 195/200 = 97.5%. Son proporciones globales aproximadas de una referencia publicada.
  - Los océanos, mares y bahías reúnen aproximadamente 96.5% del agua; no toda el agua salada está en
    el océano.
  - La disponibilidad de agua dulce y su calidad para consumo son cuestiones distintas; el modelo no diagnostica
    potabilidad.
  andamiaje: Usar dos grupos de cien marcas en papel; conservar un mapa rotulado como apoyo y retirarlo
    después.
  transferencia: Explicar qué pregunta local sobre acceso al agua no puede responderse con la proporción
    global.
  seguridad: Representación en papel; sin recoger ni probar agua de fuentes naturales.
  referencias:
  - usgs_agua
  - mined_primaria
- destino:
    grado: 4
    asignatura: Ciencias
    hoja: Unidad 1 - Máquinas y energía
    fila: 3
  id: maquinas_4
  reto: Clasificar máquinas simples y comparar la fuerza necesaria para elevar una misma carga mediante
    dos recorridos.
  contexto: Rampa de acceso como ejemplo propuesto; no se infieren las condiciones de una escuela concreta.
  ideas_previas: ¿Una rampa reduce la fuerza sin cambiar nada más? ¿Por qué el recorrido puede ser más
    largo?
  datos:
    origen: modelo_didactico_sintetico_ideal_sin_rozamiento
    tabla:
    - recorrido: elevación directa
      fuerza_N: 6
      distancia_m: 0.2
    - recorrido: rampa ideal
      fuerza_N: 2
      distancia_m: 0.6
  consignas:
  - Relaciona palanca, polea, rueda y eje, plano inclinado, cuña y tornillo con ejemplos proporcionados.
  - 'Compara las dos fuerzas y los dos recorridos de la tabla: la carga llega a la misma altura.'
  - Explica con dibujo qué cambia al reducir la fuerza usando la rampa.
  clave_docente:
  - En el modelo ideal, menor fuerza se intercambia por mayor recorrido; no se crea energía.
  - 'Nota docente, sin exigir julios a cuarto: 6 × 0.2 = 2 × 0.6 = 1.2 J.'
  - Una máquina puede cambiar la dirección de la fuerza sin reducir su magnitud; el rozamiento modifica
    el caso real.
  andamiaje: Comparar primero con flechas de fuerza y recorridos dibujados; la explicación precede a formalizar
    trabajo.
  transferencia: Clasificar un ejemplo nuevo y explicar qué facilita sin afirmar que toda máquina reduce
    cualquier fuerza.
  seguridad: Modelos livianos sobre mesa; no levantar personas o cargas sobre la cabeza. Sin instrumento,
    la comparación es documental.
  referencias:
  - openstax_maquinas
  - mined_primaria
- destino:
    grado: 6
    asignatura: Ciencias
    hoja: Unidad 1 - Fluidos
    fila: 3
  id: densidad_6
  reto: Calcular y comparar densidades de cinco objetos y justificar una predicción de flotación en un
    modelo controlado.
  contexto: Objetos ideales y agua de densidad aproximada de 1 g/cm³ para el modelo escolar; no es una
    medición de una fuente local.
  ideas_previas: ¿El objeto de mayor masa siempre se hunde? Predice antes de calcular y conserva tu respuesta.
  datos:
    origen: modelo_didactico_sintetico
    densidad_fluido_g_cm3: 1
    tabla:
    - objeto: A
      masa_g: 10
      volumen_cm3: 20
    - objeto: B
      masa_g: 40
      volumen_cm3: 20
    - objeto: C
      masa_g: 30
      volumen_cm3: 50
    - objeto: D
      masa_g: 60
      volumen_cm3: 40
    - objeto: E
      masa_g: 200
      volumen_cm3: 400
  consignas:
  - Calcula masa dividida entre volumen para cada objeto e indica sus unidades.
  - Compara cada densidad media con la del fluido; contrasta la predicción inicial.
  - Justifica por qué E, aunque tiene más masa que B, puede flotar mientras B se hunde.
  clave_docente:
  - 'Densidades: A = 0.5, B = 2, C = 0.6, D = 1.5 y E = 0.5 g/cm³.'
  - En este modelo A, C y E flotan; B y D se hunden. Se compara densidad media, no sólo masa.
  - Se excluyen efectos de tensión superficial y cambios de volumen; poros y aire atrapado importan al
    interpretar una piedra pómez real.
  andamiaje: Resolver A en conjunto, completar B en pareja y resolver C, D y E sin el cociente escrito.
  transferencia: Predecir qué cambia si el fluido tiene otra densidad y explicar por qué no basta conocer
    la masa.
  seguridad: Sin ingerir líquidos ni mezclar productos domésticos. Medición real requiere balanza, método
    de volumen y supervisión.
  referencias:
  - openstax_densidad
- destino:
    grado: 8
    asignatura: Ciencias
    hoja: Unidad 1 - Mecánica
    fila: 3
  id: calibracion_8
  reto: Interpretar una calibración y distinguir repetibilidad de concordancia con una referencia.
  contexto: Datos modelados de un dinamómetro; su lectura no certifica la construcción o calibración de
    un instrumento real.
  ideas_previas: Si tres lecturas son casi iguales, ¿eso garantiza que el instrumento indique el valor
    adecuado?
  datos:
    origen: modelo_didactico_sintetico
    referencia_modelada_N: 1
    lecturas_A_N:
    - 1.19
    - 1.2
    - 1.21
    lecturas_B_N:
    - 0.99
    - 1
    - 1.01
  consignas:
  - Compara la dispersión de las dos series y su distancia a la referencia modelada de 1 N.
  - Explica qué falla si sólo se juzga el instrumento por obtener lecturas parecidas.
  - Propón cómo registrarías varias fuerzas de referencia y sus lecturas para construir una curva de calibración.
  clave_docente:
  - Ambas series tienen el mismo rango de 0.02 N; A tiene media 1.20 N y B media 1.00 N.
  - A es repetible en estas condiciones, pero su media difiere 0.20 N de la referencia modelada; repetibilidad
    y sesgo son distintos.
  - La referencia y su incertidumbre también requieren evaluación en una calibración real; el ejemplo
    no establece trazabilidad metrológica.
  andamiaje: Marcar primero las lecturas en dos rectas numéricas con la misma escala; separar dispersión
    y diferencia con referencia.
  transferencia: Explicar qué se necesita comprobar antes de usar el instrumento para comparar fuerzas
    en otro rango.
  seguridad: Análisis en papel; construcción con resortes y cargas requiere fijaciones y límites seguros
    definidos por el docente.
  referencias:
  - pisa_final_2026
  - nist_sesgo
- destino:
    grado: 10
    asignatura: Física
    hoja: Física 10.°
    fila: 5
  id: pendiente_resorte_10
  reto: Interpretar una pendiente conservando qué magnitud ocupa cada eje y el rango de validez del modelo.
  contexto: Modelo de resorte; los datos no provienen de un laboratorio escolar ni certifican una constante
    de un objeto real.
  ideas_previas: ¿La pendiente de cualquier gráfica de un resorte es siempre k? Escribe las unidades antes
    de responder.
  datos:
    origen: modelo_didactico_sintetico
    tabla:
    - fuerza_N: 0
      alargamiento_m: 0
    - fuerza_N: 1
      alargamiento_m: 0.01
    - fuerza_N: 2
      alargamiento_m: 0.02
    - fuerza_N: 3
      alargamiento_m: 0.03
    constante_N_m: 100
  consignas:
  - Grafica alargamiento en el eje vertical y fuerza en el horizontal; calcula pendiente e intercepto.
  - Invierte los ejes y explica por qué cambia el significado y la unidad de la pendiente.
  - Indica por qué estos datos no permiten predecir el alargamiento con 50 N.
  clave_docente:
  - En x frente a F, la pendiente es 0.01 m/N = 1/k, y k = 100 N/m.
  - En F frente a x, la pendiente es k = 100 N/m; el intercepto ideal de estos datos es cero.
  - F = kx es un modelo en el régimen elástico lineal; no está justificada su extrapolación a 50 N.
  andamiaje: Escribir primero pendiente = cambio vertical/cambio horizontal, con unidades, antes de identificar
    la constante.
  transferencia: Interpretar otra gráfica con ejes intercambiados y decidir qué información falta para
    afirmar su rango lineal.
  seguridad: Trabajo documental; no probar el límite de un resorte por sobrecarga.
  referencias:
  - openstax_resorte
- destino:
    grado: 10
    asignatura: Biología
    hoja: Biología 10.°
    fila: 3
  id: biomoleculas_10
  reto: Distinguir biomoléculas pequeñas y polímeros sin generalizar que toda biomolécula orgánica es
    un polímero.
  contexto: Maíz y caña como ejemplos propuestos del contexto de la malla; no se atribuye una composición
    cuantitativa a muestras locales.
  ideas_previas: ¿La glucosa es un polímero? ¿Todos los carbohidratos dan el mismo resultado con Lugol?
  datos:
    origen: ejemplos_conceptuales_documentales
    ejemplos:
    - glucosa
    - sacarosa
    - almidón
    - triglicérido
  consignas:
  - Clasifica glucosa, sacarosa y almidón según el tipo de unidad o cadena de carbohidrato.
  - Dibuja cómo se relacionan unidades de monosacárido y polisacárido sin representar todas las biomoléculas
    como cadenas idénticas.
  - Explica qué permite concluir una prueba de almidón y qué no permite afirmar sobre todos los carbohidratos.
  clave_docente:
  - 'Glucosa: monosacárido; sacarosa: disacárido; almidón: polisacárido.'
  - Los triglicéridos no son polímeros de unidades de monosacárido; no todos los carbohidratos son polisacáridos.
  - Una prueba de almidón negativa no demuestra ausencia de todo carbohidrato. La clave conceptual no
    sustituye el registro experimental.
  andamiaje: Usar tarjetas de unidades y enlaces antes de pasar a una representación química; explicar
    el límite del dibujo.
  transferencia: Evaluar la afirmación de que cualquier alimento con carbohidratos debe dar positivo en
    una prueba de almidón.
  seguridad: Sin degustación ni prueba de reactivos; la actividad documental no exige manipular Lugol.
  referencias:
  - openstax_carbohidratos
  - openstax_lipidos
- destino:
    grado: 10
    asignatura: Química
    hoja: Química 10.°
    fila: 56
  id: evidencias_reaccion_10
  reto: Evaluar si una variación de temperatura basta para identificar una reacción química.
  contexto: Comparación documental; no se preparan mezclas ni se sopla mediante pajillas en soluciones.
  ideas_previas: Si al disolver un sólido cambia la temperatura, ¿queda demostrado que se formaron sustancias
    nuevas?
  datos:
    origen: modelo_didactico_sintetico
    temperatura_inicial_C: 22
    temperatura_final_C: 29
  consignas:
  - Describe exactamente qué muestra el dato de temperatura y separa la observación de la explicación.
  - Propón la disolución y una reacción como explicaciones a contrastar; indica qué evidencia adicional
    necesitarías.
  - Revisa un diseño de comparación que mantenga condiciones relevantes y no considere cualquier cambio
    térmico como prueba concluyente.
  clave_docente:
  - El cambio modelado es +7 °C; ese dato por sí solo no identifica productos ni demuestra una reacción
    particular.
  - La disolución puede intercambiar energía; observar calor no distingue por sí solo los mecanismos.
  - Se requieren reactivos identificados, controles pertinentes y evidencia independiente para sostener
    la explicación. La clasificación no se decide por una única señal aislada.
  andamiaje: Separar en columnas observación, explicaciones posibles y evidencia que falta; evitar una
    tabla de señales automáticas.
  transferencia: Examinar si burbujas o un cambio de color aislados bastan para identificar productos
    sin conocer el sistema.
  seguridad: Análisis de información; no ejecutar las estaciones del original sin evaluación específica
    de reactivos, concentraciones y supervisión.
  referencias:
  - openstax_disolucion
- destino:
    grado: 9
    asignatura: Ciencias
    hoja: Unidad 5 - Geología de El Salva
    fila: 3
  id: clasificar_rocas_9
  reto: Clasificar rocas con evidencia de su formación y explicar por qué el color aislado no determina
    su origen.
  contexto: Materiales de construcción como punto de partida; no se infiere el origen de toda muestra
    por el lugar donde se encuentra.
  ideas_previas: ¿Dos rocas del mismo color necesariamente se formaron del mismo modo? ¿Qué evidencia
    adicional buscarías?
  datos:
    origen: modelo_didactico_sintetico
    fichas:
    - muestra: A
      proceso_documentado: enfriamiento de material fundido
    - muestra: B
      proceso_documentado: acumulación y consolidación de sedimentos
    - muestra: C
      proceso_documentado: transformación de roca previa por presión o temperatura sin fundirse
  consignas:
  - Relaciona cada proceso documentado con el grupo de roca correspondiente.
  - Compara las fichas con una clave de referencia; registra qué rasgo usaste y qué no sabes de una muestra
    sin procedencia.
  - Evalúa una clasificación que se basa únicamente en color.
  clave_docente:
  - 'En las fichas propuestas: A es ígnea, B sedimentaria y C metamórfica.'
  - En C se conserva la condición sin fusión; la transformación no equivale a enfriamiento desde material
    fundido.
  - Los rasgos visibles aportan pistas, pero una identificación incierta debe conservar esa incertidumbre
    y buscar más evidencia.
  andamiaje: Contrastar proceso de formación y rasgo observable antes de usar la clave; ofrecer fotos
    rotuladas como ejemplo resuelto.
  transferencia: Explicar qué datos adicionales harían falta para identificar una nueva muestra sin recurrir
    sólo a su color.
  seguridad: Fotos o muestras limpias revisadas por el docente; sin probar, triturar, calentar o aplicar
    ácidos a rocas desconocidas.
  referencias:
  - usgs_rocas
  - usgs_igneas
  - usgs_sedimentarias
- destino:
    grado: 5
    asignatura: Ciencias
    hoja: Unidad 1 - Magnitudes físicas
    fila: 3
  id: medicion_si_5
  reto: Distinguir medir directamente de calcular y comunicar magnitud, unidad y resolución.
  contexto: Registro del largo y ancho de una mesa escolar; se usan datos sintéticos si no hay instrumentos.
  ideas_previas: ¿La balanza mide el área? ¿Cambiar de centímetros a metros cambia el tamaño de la mesa?
  datos:
    origen: modelo_didactico_sintetico
    largo_cm: 120
    ancho_cm: 50
    division_regla_cm: 1
  consignas:
  - Elige el instrumento y representa dónde ubicarías el cero; mide sólo si tienes una regla disponible.
  - Expresa ambas longitudes en metros y explica por qué la mesa no cambió.
  - Calcula el área rectangular y distingue qué valores se midieron y cuál se obtuvo por cálculo.
  clave_docente:
  - 120 cm = 1.20 m; 50 cm = 0.50 m; A = 0.60 m² = 6000 cm², bajo el modelo rectangular.
  - El área es una magnitud derivada; en esta tarea se calcula a partir de dos longitudes, no se lee directamente
    en la regla.
  - La división de 1 cm informa sobre la escala, pero no determina por sí sola toda la incertidumbre ni
    autoriza decimales arbitrarios.
  andamiaje: Dibujar cien centímetros dentro de un metro; comparar una conversión correcta y otra que
    divide el área sólo por cien.
  transferencia: Elegir qué medir y qué calcular para otra superficie rectangular; explicar por qué una
    forma irregular exige otro procedimiento.
  seguridad: Mesa estable y regla sin bordes peligrosos; no subir sobre muebles ni recoger medidas corporales.
  referencias:
  - mined_primaria
  - nist_sesgo
- destino:
    grado: 7
    asignatura: Ciencias
    hoja: Unidad 3 - Biodiversidad
    fila: 3
  id: biodiversidad_7
  reto: Distinguir diversidad dentro de una especie, entre especies y de ecosistemas sin confundir abundancia
    con riqueza.
  contexto: Tarjetas hipotéticas de un huerto y un entorno costero salvadoreño; no son un inventario local
    verificado.
  ideas_previas: ¿Cien individuos de la misma especie significan más especies que diez individuos de cinco
    especies?
  datos:
    origen: modelo_didactico_sintetico
    sitio_A:
      individuos: 100
      especies: 1
    sitio_B:
      individuos: 10
      especies: 5
    tarjetas:
    - Variación heredable entre variedades de una misma especie
    - Distintas especies presentes en un sitio
    - Manglar y bosque como sistemas con componentes e interacciones diferentes
  consignas:
  - Clasifica cada tarjeta por nivel de biodiversidad y explica la evidencia usada.
  - Compara abundancia y riqueza en A y B; explica qué no se puede concluir sólo con esos números.
  - Propón información adicional necesaria antes de priorizar una acción de conservación.
  clave_docente:
  - A tiene mayor número total de individuos; B tiene mayor riqueza de especies en el muestreo sintético.
  - Las tarjetas corresponden respectivamente a diversidad genética, de especies y de ecosistemas; variación
    visible por sí sola no demuestra una causa genética.
  - Riqueza no resume toda la biodiversidad; se necesitan diseño de muestreo, esfuerzo comparable y otros
    datos para una decisión real.
  andamiaje: Clasificar primero tres tarjetas contrastadas; retirar los rótulos y pedir justificar una
    cuarta que combine niveles.
  transferencia: Explicar por qué contar muchos árboles sin identificar especies no demuestra mayor diversidad
    de especies.
  seguridad: Usar tarjetas; no capturar organismos, entrar a manglares ni recolectar especies desconocidas.
  referencias:
  - cbd_biodiversidad
- destino:
    grado: 11
    asignatura: Física
    hoja: Física 11.°
    fila: 4
  id: energia_oscilador_11
  reto: Contrastar conservación de energía en un oscilador ideal con datos y límites del modelo.
  contexto: Preparación documental para analizar un video de resorte horizontal; no sustituye las mediciones
    de video del objetivo.
  ideas_previas: Cuando la velocidad es cero en un extremo, ¿desaparece la energía mecánica?
  datos:
    origen: modelo_didactico_sintetico
    masa_kg: 0.5
    constante_N_m: 100
    amplitud_m: 0.1
    posiciones_m:
    - -0.1
    - 0
    - 0.1
    energia_mecanica_J: 0.5
  consignas:
  - Calcula energía potencial elástica y cinética para cada posición y predice la rapidez máxima.
  - Distingue rapidez y velocidad; explica por qué la posición no determina por sí sola el signo de la
    velocidad.
  - Si un video muestra amplitudes decrecientes, explica qué supuesto ideal revisarías y qué mediciones
    comprobarías.
  clave_docente:
  - U = kx²/2; en los extremos U = 0.50 J y K = 0; en equilibrio U = 0 y K = 0.50 J.
  - La rapidez máxima es √(2K/m) = √2 m/s, aproximadamente 1.414 m/s; el signo de la velocidad depende
    del sentido del movimiento.
  - Se supone resorte lineal, movimiento horizontal, masa del resorte despreciable y ausencia de disipación;
    una amplitud decreciente puede indicar disipación, pero hay que examinar escala y errores de medida.
  - Los datos sintéticos son coherentes con conservación por construcción; no constituyen verificación
    experimental.
  andamiaje: Relacionar primero barras de energía con tres posiciones; después escribir ecuaciones y verificar
    unidades.
  transferencia: Comparar energía total y rapidez máxima si cambia la masa manteniendo k y amplitud; la
    energía inicial sigue siendo 0.50 J y la rapidez cambia.
  seguridad: Análisis en papel o video revisado; no tensar resortes ni improvisar cargas para reproducir
    estos valores.
  referencias:
  - openstax_resorte
- destino:
    grado: 11
    asignatura: Biología
    hoja: Biología 11.°
    fila: 3
  id: genoma_ploidia_11
  reto: Separar tamaño del genoma, número de cromosomas y ploidía en comparaciones entre especies hipotéticas.
  contexto: Tarjetas de especies ficticias; no se atribuyen estos números a organismos salvadoreños ni
    personas.
  ideas_previas: ¿Tener más cromosomas o más ADN significa necesariamente ser más complejo?
  datos:
    origen: modelo_didactico_sintetico
    unidad_ADN: Mb por juego cromosómico básico; para este modelo se explicita el tamaño de un juego,
      no un valor C de una especie real.
    tarjetas:
    - especie: A
      juegos_en_celula_no_replicada: 2
      cromosomas_por_juego: 4
      ADN_Mb_por_juego: 100
    - especie: B
      juegos_en_celula_no_replicada: 2
      cromosomas_por_juego: 4
      ADN_Mb_por_juego: 200
    - especie: C
      juegos_en_celula_no_replicada: 4
      cromosomas_por_juego: 4
      ADN_Mb_por_juego: 100
  consignas:
  - Representa los juegos con tarjetas de colores y calcula cromosomas totales y ADN total por célula
    indicada.
  - Compara A y B y después A y C; explica qué variable cambia en cada comparación.
  - Critica la afirmación de que duplicar el ADN durante la fase S equivale a duplicar la ploidía.
  clave_docente:
  - A tiene dos juegos, ocho cromosomas y 200 Mb; B tiene dos juegos, ocho cromosomas y 400 Mb; C tiene
    cuatro juegos, dieciséis cromosomas y 400 Mb en el modelo.
  - A y B mantienen ploidía y número de cromosomas pero difieren en ADN por juego; B y C tienen igual
    cantidad total de ADN con distinta ploidía.
  - Replicar ADN produce cromátidas hermanas; no añade por sí solo juegos de cromosomas homólogos ni convierte
    una célula diploide en tetraploide.
  - No se infieren complejidad, número de genes ni superioridad biológica a partir de estos números.
  andamiaje: Separar tres columnas para juegos, cromosomas y cantidad de ADN; usar un color por juego
    y distinguir cromátidas con un trazo adicional.
  transferencia: Explicar qué datos faltan si un informe sólo da cantidad total de ADN; no deducir ploidía
    sin información cromosómica y de ciclo celular.
  seguridad: Tarjetas, sin muestras humanas, pruebas genéticas personales ni inferencias sobre capacidades
    de personas.
  referencias:
  - nhgri_genoma
  - nhgri_diploide
  - openstax_ciclo_celular
- destino:
    grado: 11
    asignatura: Química
    hoja: Química 11.°
    fila: 3
  id: materiales_electronica_11
  reto: Comparar materiales para una conexión eléctrica usando propiedades, evidencia y restricciones
    explícitas.
  contexto: Decisión documental sobre materiales de un dispositivo escolar; no es una especificación de
    instalación eléctrica.
  ideas_previas: ¿El material que mejor conduce siempre es la mejor elección para cualquier pieza?
  datos:
    origen: modelo_didactico_sintetico
    unidad_resistencia: Ω para muestras de igual longitud y sección, a igual temperatura.
    muestras:
    - material: metal_A
      resistencia_ohm: 1.0
      costo_indice: 4
      requisito_union: compatible
    - material: aleacion_B
      resistencia_ohm: 2.0
      costo_indice: 2
      requisito_union: compatible
    - material: metal_C
      resistencia_ohm: 0.8
      costo_indice: 6
      requisito_union: incompatible
    restricciones:
      resistencia_maxima_ohm: 2.0
      costo_maximo_indice: 3
      union: compatible
  consignas:
  - Compara la conducción de las muestras bajo las condiciones indicadas; explica por qué controlar geometría
    y temperatura.
  - Decide qué muestra cumple todas las restricciones y justifica por qué la de menor resistencia puede
    quedar excluida.
  - Relaciona conducción con el modelo de electrones deslocalizados y señala qué propiedades adicionales
    habría que conocer para una aplicación real.
  clave_docente:
  - B cumple resistencia ≤ 2.0 Ω, costo ≤ 3 y unión compatible; A excede costo y C excede costo y falla
    compatibilidad.
  - Con igual geometría y temperatura, menor resistencia permite comparar mejor conducción en estas muestras;
    no se presenta una tabla de conductividades reales.
  - El modelo metálico relaciona conducción con electrones deslocalizados; una aleación no tiene por qué
    mejorar todas las propiedades respecto a cada metal puro.
  - Corrosión, resistencia mecánica, seguridad y condiciones reales siguen sin verificarse; el caso no
    autoriza una instalación.
  andamiaje: Marcar primero cada restricción por separado, después combinarla con una explicación científica
    y comparar una alternativa.
  transferencia: Si el presupuesto sube a cuatro, A también resulta viable; justificar qué criterio adicional
    usar para elegir entre A y B.
  seguridad: Sólo análisis de fichas; no abrir equipos, fundir metales, soldar ni trabajar con tensión
    de red o residuos electrónicos.
  referencias:
  - openstax_metales
