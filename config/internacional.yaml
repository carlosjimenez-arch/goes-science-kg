# Documentos que se extraen para los grafos internacionales de 9.°–11.° (spec 11).
# Las descargas, con URL, sha256, licencia y notas de vigencia, están en
# data/fuentes/externos/paises/<pais>/sec_bach/_registro.json (Japón: japon/bachillerato/).
#
# Por cada documento:
#   paginas:     páginas del PDF (1 = primera página del ARCHIVO, no la numeración impresa). Puede ser [p0, p1]
#                o una lista de rangos.
#   nivel:       nucleo (lo cursa la mayoría) | especializacion (electiva).
#   grado_sv:    rango de grados equivalentes de El Salvador cuando el documento no precisa el año.
#   grados_pais: año del país → grado SV, cuando el documento sí lo precisa.
#   asignatura:  fisica | quimica | biologia | tierra_espacio | ciencias_integradas (el modelo decide por objetivo).
# Se eligió UN documento por curso para no contar dos veces el mismo contenido. Lo que se descartó, y por qué,
# va al final.

