    eje: contenido
    etiqueta: Procesos del planeta y su entorno espacial
    paginas_pdf: [38]
    ancla: Earth and space systems
    alcance: Población nominal de 15 años; seleccionar contenidos según la V4 y sus prerrequisitos.
  - id: LOCAL:pisa2025_explicar_fenomenos
    fuente: pisa_2025_marco_final
    eje: practica
    etiqueta: Explicar fenómenos y justificar predicciones mediante ciencia
    paginas_pdf: [34]
    ancla: Explain phenomena
    alcance: Paráfrasis de la primera competencia para 15 años; requiere desempeño observable.
  - id: LOCAL:pisa2025_investigar_interpretar
    fuente: pisa_2025_marco_final
    eje: practica
    etiqueta: Valorar diseños de investigación e interpretar críticamente evidencia
    paginas_pdf: [34]
    ancla: experimental design
    alcance: Paráfrasis de la segunda competencia para 15 años; no se reduce a ejecutar instrucciones.
  - id: LOCAL:pisa2025_evaluar_informacion_decidir
    fuente: pisa_2025_marco_final
    eje: practica
    etiqueta: Buscar y contrastar información científica para fundamentar decisiones
    paginas_pdf: [36]
    ancla: scientific claims
