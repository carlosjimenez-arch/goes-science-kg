schema_version: '1.0'
meta:
  clasificacion: parafrasis_del_proyecto
  no_equivalencia: No es alineación ni código oficial
  corte: '2026-10-21'
  alcance: Muestra operativa de 22 dimensiones; no es el catálogo exhaustivo de los tres marcos.
  paginas: Numeración PDF desde 1, incluida la portada; no confundir con folio impreso.
  procedencia: data/referencias_2026/manifest.json
  auditoria: docs/investigacion/auditoria_fuentes_primarias.md
  limites:
    - El ancla permite localizar texto; su presencia no demuestra alineación de una propuesta.
    - Los ejes son organización local; las taxonomías de marcos diferentes no son equivalentes.
    - Demanda incluye familias de procesos cuando la fuente usa esa organización; no implica dificultad empírica.
    - No se trasladan edad, grado, ponderaciones ni resultados entre ciclos o jurisdicciones.
dimensiones:
  - id: LOCAL:pisa2025_sistemas_fisicos
    fuente: pisa_2025_marco_final
    eje: contenido
    etiqueta: Materia, interacciones, movimiento y energía en sistemas físicos
    paginas_pdf: [38]
    ancla: Physical systems
    alcance: Población nominal de 15 años; dominio amplio, no secuencia de grado salvadoreña.
  - id: LOCAL:pisa2025_sistemas_vivos
    fuente: pisa_2025_marco_final
    eje: contenido
    etiqueta: Organismos, procesos vitales y relaciones ecológicas
    paginas_pdf: [38]
    ancla: Living systems
    alcance: Población nominal de 15 años; compartir un tema no acredita una competencia.
