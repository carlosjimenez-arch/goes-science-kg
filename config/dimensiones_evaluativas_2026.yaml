    etiqueta: Conocer procedimientos para obtener y comunicar evidencia
    paginas_pdf: [24]
    ancla: procedural knowledge
    alcance: Tipo de conocimiento de PISA para 15 años; considerar medición, variables e incertidumbre según la tarea.
  - id: LOCAL:pisa2025_saber_epistemico
