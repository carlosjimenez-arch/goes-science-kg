    paginas_pdf: [24]
    ancla: content knowledge
    alcance: Tipo de conocimiento de PISA; distinto del eje temático contenido y sin equivalencia automática con ERCE o TIMSS.
  - id: LOCAL:pisa2025_saber_procedimental
    fuente: pisa_2025_marco_final
