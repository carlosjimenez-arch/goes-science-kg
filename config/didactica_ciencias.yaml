version: didactica-ciencias-1
limite: >-
  Propuesta de diseño instruccional basada en tareas de las mallas finales y referencias primarias.
  Los códigos E/D/I son locales. La vinculación documental no acredita alineación semántica,
  dominio de habilidades, dificultad psicométrica ni eficacia. Los apoyos se ajustan por diagnóstico.
referencias:
  - id: pisa_final_2026
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2026/05/pisa-2025-assessment-and-analytical-framework_3abce6d6/86c36975-en.pdf
    localizador: Capítulo 2, cuadros 2.1 a 2.5; población de 15 años.
    uso: Referente para organizar prácticas; no equivalencia entre grados ni códigos oficiales E/D/I.
  - id: mined_primaria
    url: https://www.mined.gob.sv/materiales/2026/CIENCIA_Y_TECNOLOGIA/1.%20Programas%20de%20estudio/Programas%20de%20estudio_Ciencia%20y%20Tecnolog%C3%ADa_2.%C2%B0%20a%206.%C2%B0%20grados.pdf
    localizador: Perfiles de estudiante y fundamento ICC+I.
    uso: Contexto salvadoreño, investigación, creación y comunicación; la ruta 2026 no acredita fecha normativa.
  - id: mined_metodologia
    url: https://www.mined.gob.sv/materiales/2026/CIENCIA_Y_TECNOLOGIA/guias/Gu%C3%ADa%20metodol%C3%B3gica%202.%C2%B0%20grado%2C%20tomo%201.pdf
    localizador: Fundamento metodológico, experiencias científicas e ICC+I, página impresa 6.
    uso: Vincular manipulación, razonamiento y contraste final; actividad práctica por sí sola no demuestra comprensión.
  - id: eef_primaria
    url: https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/primary-science-ks1-ks2/
    localizador: Recomendaciones de la guía 2023.
    uso: Vocabulario y enseñanza científica; adaptación propuesta a las condiciones de cada aula.
  - id: eef_secundaria
    url: https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/science-ks3-ks4
    localizador: Guía de 2018.
    uso: Ideas previas, modelos, memoria, lenguaje, práctica, razonamiento y retroalimentación.
  - id: ies_aprendizaje
    url: https://ies.ed.gov/ncee/wwc/PracticeGuide/1
    localizador: Recomendaciones 1, 2, 3, 4, 5b y 7; fuerza de evidencia diferenciada.
    uso: Ejemplos, representaciones, recuperación y explicación; intervalos a ajustar, sin pauta universal validada.
macrohabilidades:
  explicacion_modelizacion:
    nombre: Explicar, representar y modelizar fenómenos
    intencion: Relacionar conceptos, representaciones y predicciones con evidencia y condiciones de validez.
  indagacion_datos:
    nombre: Indagar, analizar datos y evaluar diseños
    intencion: Relacionar pregunta, procedimiento, datos y conclusión, considerando límites y seguridad.
  informacion_argumentacion_decisiones:
    nombre: Evaluar información, argumentar y decidir
    intencion: Distinguir fuentes y evidencias, justificar conclusiones y decisiones y examinar alternativas.
rubrica_comun:
  naturaleza: Descriptores propuestos; no puntuaciones observadas ni niveles internacionales.
  inicio: La respuesta todavía no permite comprobar los criterios; identificar el obstáculo concreto.
  con_apoyo: Cumple criterios con pistas; registrar qué ayuda necesitó y volver a observar sin ella.
  autonomo: Cumple criterios y justifica su respuesta sin las pistas retiradas.
  transferencia: Conserva el razonamiento al cambiar un aspecto relevante y explicita cuándo deja de valer.
  regla: No promediar un error científico con presentación, esfuerzo o participación.
habilidades:
  E1:
    evidencia: Explicación o clasificación aplicada a la situación concreta, con el concepto que la sostiene.
    criterios: [Usa el concepto en el caso y no sólo repite su definición., Distingue un ejemplo pertinente de un contraejemplo y explica la diferencia.]
    retroalimentacion: Señala qué parte de tu respuesta explica este caso; prueba ahora un caso que no cumpla esa condición.
    error: Confundir recordar palabras con explicar el fenómeno o clasificar por rasgos irrelevantes.
    apoyo: Contrastar un ejemplo resuelto y un contraejemplo; señalar la propiedad que cambia.
    retirada: Presentar otro objeto o situación sin las etiquetas del ejemplo.
    transferencia: Elegir y justificar un caso nuevo en que el mismo concepto sea útil.
  E2:
    evidencia: Dos representaciones relacionadas mediante correspondencias explícitas.
    criterios: [Identifica qué representa cada símbolo o elemento., Conserva el significado y las unidades al pasar de una representación a otra.]
    retroalimentacion: Muestra dónde aparece en el dibujo o gráfico lo que afirmas con palabras; revisa la correspondencia que falta.
    error: Producir un dibujo decorativo o copiar un gráfico sin interpretar ejes, símbolos o relaciones.
    apoyo: Hacer una correspondencia en voz alta y dejar otra incompleta para que se justifique.
    retirada: Cambiar la representación inicial y pedir construir la otra sin plantilla completa.
    transferencia: Explicar qué información conserva y qué oculta una representación distinta.
  E3:
    evidencia: Predicción registrada antes de conocer el resultado, con razón y contraste posterior.
    criterios: [Predice antes de observar y fundamenta con una relación científica., Compara predicción y resultado sin reescribir la predicción inicial.]
    retroalimentacion: Conserva tu predicción; identifica qué dato te haría revisarla y qué parte de tu explicación cambiarías.
    error: Adivinar sin razón o presentar como predicción algo escrito después de ver la respuesta.
    apoyo: Usar dos resultados posibles y pedir una razón para elegir, sin anunciar el resultado.
    retirada: Retirar las opciones y pedir una predicción propia razonada.
    transferencia: Cambiar una condición relevante y explicar si la predicción debe cambiar.
  E4:
    evidencia: Modelo anotado con componentes, relaciones, una predicción y un límite.
    criterios: [Relaciona componentes del modelo con el fenómeno., Usa el modelo para explicar o predecir y reconoce una limitación pertinente.]
    retroalimentacion: ¿Qué representa cada parte y qué deja fuera? Comprueba una predicción antes de mejorar el modelo.
    error: Confundir la maqueta con la realidad o evaluar sólo su apariencia.
    apoyo: Comparar dos modelos sencillos del mismo fenómeno y discutir qué permite explicar cada uno.
    retirada: Pedir elegir o revisar el modelo sin indicar de antemano la representación correcta.
    transferencia: Identificar una situación en que el modelo ya no dé una explicación suficiente.
  E5:
    evidencia: Hipótesis explicativa y predicción que permitan imaginar una observación que la contradiga.
    criterios: [Propone una explicación relacionada con el fenómeno., Distingue la explicación de la predicción y plantea cómo contrastarla.]
    retroalimentacion: Explica por qué podría ocurrir; después indica qué esperarías observar si esa explicación fuese adecuada.
    error: Formular una opinión imposible de contrastar o confundir hipótesis con resultado seguro.
    apoyo: Separar en tarjetas explicación, predicción y observación; usar lenguaje oral cuando sea necesario.
    retirada: Retirar la estructura verbal y pedir explicar cómo se comprobaría la idea.
    transferencia: Proponer otra explicación y decidir qué observación permitiría distinguir ambas.
  E6:
    evidencia: Relación argumentada entre conocimiento científico y consecuencias para una situación social.
    criterios: [Explicita qué conocimiento científico utiliza., Diferencia una consecuencia respaldada de una valoración o una suposición.]
    retroalimentacion: ¿Qué parte de tu explicación procede de ciencia y qué parte es una preferencia? Indica quiénes podrían verse afectados.
    error: Usar un nombre local como adorno o afirmar beneficios y riesgos sin relación causal justificada.
    apoyo: Construir una cadena breve entre fenómeno, explicación y consecuencia; contrastar una alternativa.
    retirada: Pedir la cadena sin las flechas ni los conectores preparados.
    transferencia: Considerar cómo cambia la decisión con otras condiciones o necesidades comunitarias.
  D1:
    evidencia: Pregunta delimitada que indica qué observar o comparar.
    criterios: [La pregunta puede abordarse con observaciones o datos disponibles., Identifica qué evidencia ayudaría a responderla sin presuponer el resultado.]
    retroalimentacion: Acota qué compararás y qué registrarás; comprueba si esos datos realmente contestan la pregunta.
    error: Confundir una pregunta general o de opinión con una pregunta investigable con los medios disponibles.
    apoyo: Contrastar una pregunta amplia y una acotada; señalar evidencia posible y condiciones de seguridad.
    retirada: Pedir revisar una pregunta nueva sin entregar su reformulación.
    transferencia: Adaptar la pregunta si cambia el acceso a instrumentos o a fuentes de datos.
  D2:
    evidencia: Plan de investigación que conecta pregunta, procedimiento, registro y seguridad.
    criterios: [El procedimiento obtiene evidencia pertinente y declara qué condiciones comparar o mantener., Explicita instrumentos, registro y límites; contempla repeticiones cuando sean pertinentes.]
    retroalimentacion: Sigue el plan como si fueras otro equipo; localiza una decisión que falte para poder interpretar los datos.
    error: Seguir una receta sin relación con la pregunta o cambiar varias condiciones sin poder separar sus efectos.
    apoyo: Modelar una elección de diseño y pedir justificar otra; no todas las investigaciones requieren experimento controlado.
    retirada: Retirar pasos preparados y pedir justificar el procedimiento elegido.
    transferencia: Rediseñar ante una limitación real de materiales sin afirmar que otra actividad mide el mismo desempeño práctico.
  D3:
    evidencia: Crítica de un diseño con problema localizado y mejora justificada.
    criterios: [Relaciona una limitación concreta con las conclusiones que permite obtener., Propone una mejora y explica qué problema resolvería.]
    retroalimentacion: Señala el paso o dato que limita la conclusión; explica cómo tu cambio mejora la respuesta a la pregunta.
    error: Decir que el experimento está mal sin evidencia o proponer más repeticiones como solución a cualquier sesgo.
    apoyo: Comparar dos diseños que difieren en una decisión; mantener visible la pregunta.
    retirada: Presentar un diseño nuevo sin marcar dónde está la limitación.
    transferencia: Evaluar si una mejora sigue siendo viable y segura al cambiar el contexto.
  D4:
    evidencia: Datos organizados e interpretación que relaciona conclusión, unidades y límites.
    criterios: [Organiza y lee los datos con etiquetas y unidades pertinentes., Justifica una conclusión con datos concretos y no la extiende más allá de lo observado.]
    retroalimentacion: Señala los datos que apoyan tu afirmación y explica qué conclusión todavía no puedes sostener.
    error: Confundir correlación con causa, pendiente con cualquier constante o precisión numérica con calidad de la evidencia.
    apoyo: Distinguir observación, patrón e interpretación; modelar una lectura de tabla o gráfico.
    retirada: Quitar colores o preguntas intermedias y pedir justificar la interpretación.
    transferencia: Analizar otro conjunto de datos o un dato discordante y explicar sus implicaciones.
  I1:
    evidencia: Selección de fuentes con autoría, fecha pertinente y evidencia que respalda cada afirmación.
    criterios: [Identifica procedencia y distingue una fuente original de una repetición., Justifica pertinencia y limitaciones para la pregunta; prestigio o actualidad solos no bastan.]
    retroalimentacion: Localiza la afirmación y su evidencia en la fuente; explica por qué sirve para esta pregunta y qué deja sin resolver.
    error: Dar por cierta una respuesta de IA, el primer resultado de búsqueda o una institución sin leer su evidencia.
    apoyo: Entregar dos extractos impresos con procedencia y mostrar una comparación de fiabilidad.
    retirada: Retirar la selección previa cuando haya acceso real a fuentes seguras y suficientes.
    transferencia: Resolver una contradicción entre fuentes y explicar qué dato adicional haría falta.
  I2:
    evidencia: Clasificación justificada de afirmaciones, evidencias y opiniones.
    criterios: [Distingue el dato observado de su interpretación y de la opinión., Valora la relación entre evidencia y afirmación sin depender sólo de quién la dice.]
    retroalimentacion: Subraya el dato y la afirmación por separado; explica si el primero alcanza para sostener la segunda.
    error: Confundir opinión muy repetida o testimonio aislado con evidencia suficiente.
    apoyo: Clasificar extractos breves en voz alta y mostrar un caso en que un dato no basta.
    retirada: Quitar categorías preparadas y pedir justificarlas con sus propias palabras.
    transferencia: Examinar otra afirmación sobre el mismo fenómeno y comparar su respaldo.
  I3:
    evidencia: Argumento con afirmación, evidencia específica y razonamiento que las conecta.
    criterios: [Selecciona evidencia pertinente para una afirmación concreta., Explica la relación científica entre esa evidencia y su conclusión y considera un límite.]
    retroalimentacion: Ya indicaste un dato; añade por qué ese dato apoya tu explicación y qué otra explicación habría que descartar.
    error: Enumerar datos sin explicar su relación con la conclusión o usar la conclusión como su propia prueba.
    apoyo: Separar afirmación, evidencia y razón en tres espacios; aceptar respuesta oral o diagrama si conserva la relación.
    retirada: Retirar los tres espacios y pedir un argumento integrado.
    transferencia: Revisar el argumento ante evidencia nueva que contradiga una parte de la explicación.
  I4:
    evidencia: Crítica que localiza una inferencia defectuosa y construye una alternativa limitada por la evidencia.
    criterios: [Identifica el salto entre datos y conclusión., Formula una conclusión más prudente y señala qué evidencia permitiría mejorarla.]
    retroalimentacion: Identifica exactamente qué se está suponiendo y qué conclusión permiten realmente los datos.
    error: Rechazar todo el argumento por un detalle o extrapolar una relación fuera de sus condiciones de validez.
    apoyo: Contrastar afirmación fuerte y conclusión limitada; explicitar las condiciones que cambian.
    retirada: Presentar un argumento sin señalar el salto lógico.
    transferencia: Detectar el mismo tipo de fallo en otro contexto sin depender de las mismas palabras.
  I5:
    evidencia: Decisión con alternativas, evidencia, límites y consecuencias consideradas.
    criterios: [Compara opciones usando evidencia pertinente y distingue restricciones y valores., Justifica su elección e indica qué cambio de evidencia o condiciones le haría revisarla.]
    retroalimentacion: Explica por qué eliges esta opción frente a otra y qué incertidumbre es importante para decidir.
    error: Tomar una decisión por autoridad o preferencia y añadir una cita decorativa después.
    apoyo: Usar una tabla breve de opciones, evidencias y consecuencias sin indicar la opción preferida.
    retirada: Retirar las opciones preparadas y pedir justificar las propias.
    transferencia: Revisar la decisión si cambia una condición importante para otra comunidad o grupo.
