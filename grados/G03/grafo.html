ertebrados e insectos", "detalle": "Animales sin columna vertebral, como insectos, arácnidos, moluscos y gusanos; los insectos tienen seis patas, tres regiones corporales y exoesqueleto.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/microorganismos", "label": "Microorganismos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Microorganismos", "detalle": "Seres vivos microscópicos, como bacterias, hongos microscópicos y protistas, que pueden ser beneficiosos o causar enfermedades.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/necesidades-de-los-seres-vivos", "label": "Necesidades de los seres vivos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Necesidades de los seres vivos", "detalle": "Plantas y animales requieren aire, agua, alimento o luz y un ambiente adecuado para sobrevivir.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/nutricion-autotrofa-y-heterotrofa", "label": "Nutrición autótrofa y heterótrofa", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Nutrición autótrofa y heterótrofa", "detalle": "Las plantas fabrican su alimento con luz, aire y agua; los animales obtienen alimento comiendo plantas u otros animales.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/partes-de-la-planta-y-sus-funciones", "label": "Partes de la planta y sus funciones", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Partes de la planta y sus funciones", "detalle": "Raíz, tallo, hoja, flor, fruto y semilla cumplen funciones de fijación, transporte, fabricación de alimento y reproducción.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/productores-consumidores-descomponedores", "label": "Productores, consumidores y descomponedo…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Productores, consumidores y descomponedores", "detalle": "Papeles de los organismos en un ecosistema: producir materia orgánica, consumirla o descomponerla devolviendo nutrientes al suelo.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/reinos-de-los-seres-vivos", "label": "Grandes grupos taxonómicos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Grandes grupos taxonómicos", "detalle": "Bacterias, protistas, hongos, plantas y animales se distinguen por tipo celular, nutrición, organización y reproducción.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/respuesta-a-estimulos", "label": "Respuesta de los seres vivos a estímulos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Respuesta de los seres vivos a estímulos", "detalle": "Los seres vivos detectan cambios externos como temperatura, luz o peligro y responden con conductas o cambios corporales.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/seres-vivos-y-no-vivos", "label": "Seres vivos y no vivos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Seres vivos y no vivos", "detalle": "Los seres vivos nacen, crecen, se nutren, responden a estímulos, se reproducen y mueren; los objetos no vivos no realizan esas funciones.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/sistema-respiratorio", "label": "Sistema respiratorio", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Sistema respiratorio", "detalle": "Órganos que llevan aire a los pulmones, donde el oxígeno pasa a la sangre y se expulsa dióxido de carbono.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/tipos-de-patogenos", "label": "Tipos de patógenos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Tipos de patógenos encias_tierra_espacio/capas-internas-de-la-tierra", "label": "Capas internas de la Tierra", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Capas internas de la Tierra", "detalle": "La Tierra se compone de corteza, manto, núcleo externo líquido y núcleo interno sólido, con composición, temperatura y densidad distintas.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/ciclo-de-las-rocas", "label": "Ciclo de las rocas", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Ciclo de las rocas", "detalle": "Proceso continuo por el que las rocas se transforman de un tipo en otro mediante fusión, enfriamiento, meteorización, erosión, sedimentación y metamorfismo.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/ciclo-del-agua", "label": "Ciclo del agua", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Ciclo del agua", "detalle": "Circulación continua del agua por evaporación, transpiración, condensación, precipitación, escorrentía e infiltración, impulsada por la energía solar.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/ciclones-tropicales-y-tormentas", "label": "Ciclones tropicales y tormentas", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Ciclones tropicales y tormentas", "detalle": "Sistemas de baja presión sobre océanos cálidos con vientos intensos, lluvias y oleaje; incluyen depresiones, tormentas tropicales y huracanes.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/composicion-de-la-atmosfera", "label": "La atmósfera y su composición", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "La atmósfera y su composición", "detalle": "Capa de aire que rodea la Tierra, mezcla atura": "ciencias_tierra_espacio", "titulo": "El océano: propiedades del agua de mar y zonas", "detalle": "El agua de mar tiene sales disueltas; salinidad, temperatura, luz y densidad varían con la profundidad, definiendo zonas oceánicas distintas.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/recursos-minerales-y-mineria", "label": "Recursos minerales y minería", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Recursos minerales y minería", "detalle": "Los minerales útiles se extraen de yacimientos limitados; su explotación aporta materias primas pero genera impactos ambientales y sociales.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/recursos-renovables-y-no-renovables", "label": "Recursos naturales renovables y no renov…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Recursos naturales renovables y no renovables", "detalle": "Agua, viento, suelo, bosques, minerales y combustibles que usamos; los renovables se regeneran y los no renovables son finitos.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/registro-fosil-y-cambios-ambientales", "label": "Registro fósil y cambios ambientales del…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Registro fósil y cambios ambientales del pasado", "detalle": "La ubicación y el orden de los fósiles en los estratos permiten inferir cómo cambiaron los ambientes, la superficie terrestre y la vida.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/sismos", "label": "Sismos y fallas geológicas", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Sismos y fallas geológicas", "detalle": "Liberación brusca de energía acumulada en fallas o bordes de  y concentración", "detalle": "Cantidad de soluto en cierta cantidad de disolución, expresada cualitativamente o en porcentaje, g/L o ppm.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/disolucion-y-su-rapidez", "label": "Disolución y rapidez de disolución", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Disolución y rapidez de disolución", "detalle": "Un sólido se disuelve en un líquido como el agua; temperatura, agitación y superficie de contacto aumentan su rapidez.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/disoluciones-coloides-y-suspensiones", "label": "Disoluciones, coloides y suspensiones", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Disoluciones, coloides y suspensiones", "detalle": "Dispersiones que se distinguen por el tamaño de partícula dispersa: las disoluciones son homogéneas; coloides muestran efecto Tyndall; suspensiones sedimentan.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/fuerzas-intermoleculares", "label": "Fuerzas intermoleculares", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Fuerzas intermoleculares", "detalle": "Atracciones entre moléculas: dispersión de London, dipolo-dipolo y puentes de hidrógeno, cuya intensidad depende de geometría y polaridad.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/materia-y-materiales", "label": "Materia y materiales", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Materia y materiales", "detalle": "Todo lo que tiene masa y ocupa volumen es materia; los objetos están hechos de materiales cuyas propiedades medibles determinan sus usos.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/mezclas", "label": "Mezclas homogéneas y heterogéneas", "tipo": "Concepto", "asignatura": "q // vis-network dibuja en canvas: los colores de texto se fijan aquí (no toma las variables CSS).
const oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
const tinta = oscuro ? '#ececea' : '#1d1d1b';
DATOS.nodos.forEach(n => {
  n.font = n.shape === 'box' ? {color: '#ffffff', size: 13, face: 'Arial'} : {color: tinta, size: 11, face: 'Arial'};
  if (n.shape === 'box') n.margin = 6;
  n.hidden = n.tipo === 'Tema';  // vista inicial: mapa de conceptos y prácticas
});
const nodos = new vis.DataSet(DATOS.nodos), aristas = new vis.DataSet(DATOS.aristas);
const red = new vis.Network(document.getElementById('red'), {nodes: nodos, edges: aristas}, {
  physics: {solver: 'forceAtlas2Based', forceAtlas2Based: {gravitationalConstant: -90, springLength: 140},
            stabilization: {iterations: 400}},
  layout: {improvedLayout: false},
  nodes: {scaling: {label: {drawThreshold: 3}}}, interaction: {hover: true, tooltipDelay: 150}});
red.once('stabilizationIterationsDone', () => { red.setOptions({physics: false}); red.fit(); });
function filtrar(){
  const asigs = new Set([...document.querySelectorAll('.asig:checked')].map(e => e.value));
  const temas = document.getElementById('temas').checked, q = document.getElementById('buscar').value.toLowerCase();
  nodos.update(DATOS.nodos.map(n => ({id: n.id, hidden: (n.asignatura && !asigs.has(n.asignatura)) ||
    (!temas && n.tipo === 'Tema') || (q && !n.titulo.toLowerCase().includes(q) && n.tipo !== 'Practica' && q.length > 2)})));
}
document.querySelectorAll('input').forEach(e => e.addEventListener('input', filtrar));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
red.on('click', p => {
  if (!p.nodes.length) return; const n = nodos.get(p.nodes[0]);
  const vec = red.getConnectedNodes(n.id).map(i => nodos.get(i)).filter(Boolean);
  document.getElementById('detalle').innerHTML = `<h3>${esc(n.titulo)}</h3><p class="muted">${esc(n.tipo)} · ${esc(n.asignatura || 'transversal')}${n.estado ? ' · prerrequisito ' + esc(n.estado) : ''}</p>
    <p>${esc(n.detalle)}</p>${n.fuente ? `<p class="muted">Fuente: ${esc(n.fuente)}</p>` : ''}
    <p><b>Conectado con (${vec.length})</b></p><ul>${vec.slice(0, 40).map(v => `<li>${esc(v.titulo)}</li>`).join('')}</ul>
    <p class="muted">${esc(n.id)}</p>`;
});
