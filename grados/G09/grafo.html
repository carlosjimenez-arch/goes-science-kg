ntinentes se han desplazado.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/erosion-y-sedimentacion", "label": "Erosión, transporte y sedimentación", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Erosión, transporte y sedimentación", "detalle": "El viento, el agua y el hielo arrancan y transportan materiales que se depositan en capas, modificando el paisaje muy lentamente.", "fuente": "", "estado": "previo", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/geologia-y-geomorfologia-de-el-salvador", "label": "Geología y geomorfología de El Salvador", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Geología y geomorfología de El Salvador", "detalle": "El territorio salvadoreño está formado principalmente por rocas volcánicas recientes, organizadas en formaciones y unidades de relieve mostradas en el mapa geológico.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/gravedad-y-orbitas", "label": "Gravedad y órbitas", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Gravedad y órbitas", "detalle": "La atracción gravitatoria del Sol y los planetas mantiene a planetas y satélites en sus órbitas.", "fuente": "", "estado": "ausente", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/hidrosfera-distribucion-del-agua", "label": "Hidrosfera: distribución del agua dulce …", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Hidrosfera: distribución del agua dulce y salada", "detalle": "La mayor parte de la superficie es agua, casi toda salada en océanos; el agua dulce, escasa, está en glaciares, subsuelo, ríos y lagos.", "fuente": "", "estado": "previo", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/inclinacion-del-eje-y-estaciones", "label": "Inclinación del eje terrestre y estacion…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Inclinación del eje terrestre y estaciones astronómicas", "detalle": "La inclinación del eje durante la traslación cambia el ángulo de los rayos solares y la duración del día, originando las estaciones.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/interaccion-oceano-atmosfera", "label": "Interacción océano-atmósfera", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Interacción océano-atmósfera", "detalle": "El océano intercambia calor, agua y gases con la atmósfera, regulando el clima; fenómenos como El Niño alteran lluvias y temperaturas.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/la-luna", "label": "La Luna: características y origen", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "La Luna: características y origen", "detalle": "Satélite natural de la Tierra que gira a su alrededor, sin atmósfera apreciable, con cráteres; probablemente se formó tras un gran impacto.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/limites-de-placas", "label": "Límites de placas: convergentes, diverge…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Límites de placas: convergentes, divergentes y transformantes", "detalle": "Las placas se separan, chocan o se deslizan lateralmente; cada tipo de borde produce rasgos y fenómenos característicos, como la subducción.", "fuente": "", "estado": "previo", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/mareas", "label": "Mareas", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Mareas", "detalle": "Subidas y bajadas periódicas del nivel del mar causadas principalmente por la atracción gravitatoria de la Luna y, en menor medida, del Sol.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/meteorizacion", "label": "Meteorización", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Meteorización", "detalle": "Desintegración y alteración de las rocas en su lugar por acción física, química y biológica del agua, el aire, la temperatura y los seres vivos.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/minerales-y-sus-propiedades", "label": "Minerales y sus propiedades", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Minerales y sus propiedades", "detalle": "Sólidos naturales inorgánicos de composición química definida y estructura cristalina, identificables por dureza, brillo, color, raya y exfoliación.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:ciencias_tierra_espacio/oleaje-y-dinamica-costera", "label": "Oleaje, dinámica costera y sedimentación…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Oleaje, dinámica costera y sedimentación marina", "detalle": "Las olas, generadas por el viento, erosionan y transportan sedimentos a lo largo de la costa, formando playas, esteros y depósitos marinos.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/ondas-sismicas", "label": "Ondas sísmicas, magnitud e intensidad", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Ondas sísmicas, magnitud e intensidad", "detalle": "Ondas P, S y superficiales transportan la energía del sismo; la magnitud mide la energía liberada y la intensidad sus efectos locales.", "fuente": "", "estado": "previo", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/origen-del-vulcanismo", "label": "Origen del magma y vulcanismo", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Origen del magma y vulcanismo", "detalle": "El magma se forma por fusión parcial del manto o la corteza, sobre todo en zonas de subducción, dorsales y puntos calientes.", "fuente": "", "estado": "previo", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/planetas-y-su-comparacion", "label": "Planetas: tipos y comparación", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Planetas: tipos y comparación", "detalle": "Los planetas rocosos interiores y gaseosos exteriores difieren en tamaño, composición, atmósfera, temperatura y distancia al Sol.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/precursores-y-monitoreo-geologico", "label": "Precursores, monitoreo y alerta de sismo…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Precursores, monitoreo y alerta de sismos y erupciones", "detalle": "Señales como enjambres sísmicos, deformación o emisión de gases permiten vigilar volcanes y fallas y emitir alertas tempranas.", "fuente": "", "estado": "", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/propiedades-del-agua-de-mar", "label": "El océano: propiedades del agua de mar y…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "El océano: propiedades del agua de mar y zonas", "detalle": "El agua de mar tiene sales disueltas; salinidad, temperatura, luz y densidad varían con la profundidad, definiendo zonas oceánicas distintas.", "fuente": "", "estado": "previo", "shape": "box", "color": "#EF6C00", "size": 14}, {"id": "CON:ciencias_tierra_espacio/radiacion-solar-y-balance-energetico", "label": "Calentamiento desigual de la Tierra y ci…", "tipo": "Concepto", "asignatura": "ciencias_tierra_espacio", "titulo": "Calentamiento desigual de la Tierra y circulación atmosférica", "detalle" -vibraciones", "label": "El sonido se produce por vibraciones", "tipo": "Concepto", "asignatura": "fisica", "titulo": "El sonido se produce por vibraciones", "detalle": "Los objetos que vibran producen sonido, que viaja hasta el oído a través de un medio.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:fisica/temperatura-medicion-escalas", "label": "Temperatura y escalas termométricas", "tipo": "Concepto", "asignatura": "fisica", "titulo": "Temperatura y escalas termométricas", "detalle": "La temperatura se mide con termómetros en escalas Celsius, Fahrenheit y Kelvin, con puntos fijos y cero absoluto.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:fisica/torque", "label": "Torque o momento de fuerza", "tipo": "Concepto", "asignatura": "fisica", "titulo": "Torque o momento de fuerza", "detalle": "Capacidad de una fuerza para producir rotación; producto de la fuerza por su brazo de palanca.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:fisica/transformaciones-energia", "label": "Transformaciones de la energía", "tipo": "Concepto", "asignatura": "fisica", "titulo": "Transformaciones de la energía", "detalle": "La energía pasa de una forma a otra en aparatos y procesos (eléctrica a luz, calor o sonido).", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:fisica/ventaja-mecanica", "label": "Ventaja mecánica", "tipo": "Concepto", "asignatura": "fisica", "titulo": "Ventaja mecánica", "detalle": "Cociente entre la fuerza obtenida y la aplicada en una máquina; ganar fuerza implica recorrer mayor distancia.", "fuente": "", "estado": "", "shape": "box", "color": "#1565C0", "size": 14}, {"id": "CON:fisica/viscosidad-regimen-flujo", "label": "Viscosidad y régimen de flujo", "tipo": "Concepto", "asignatura": "fisica", "titulo": "Viscosidad y régimen de flujo", "detalle": "Resistencia inte // vis-network dibuja en canvas: los colores de texto se fijan aquí (no toma las variables CSS).
const oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
const tinta = oscuro ? '#ececea' : '#1d1d1b';
DATOS.nodos.forEach(n => {
  n.font = n.shape === 'box' ? {color: '#ffffff', size: 13, face: 'Arial'} : {color: tinta, size: 11, face: 'Arial'};
  if (n.shape === 'box') n.margin = 6;
  n.hidden = n.tipo === 'Tema';  // vista inicial: mapa de conceptos y prácticas
});
const nodos = new vis.DataSet(DATOS.nodos), aristas = new vis.DataSet(DATOS.aristas);
const red = new vis.Network(document.getElementById('red'), {nodes: nodos, edges: aristas}, {
  physics: {solver: 'forceAtlas2Based', forceAtlas2Based: {gravitationalConstant: -90, springLength: 140},
            stabilization: {iterations: 400}},
  layout: {improvedLayout: false},
  nodes: {scaling: {label: {drawThreshold: 3}}}, interaction: {hover: true, tooltipDelay: 150}});
red.once('stabilizationIterationsDone', () => { red.setOptions({physics: false}); red.fit(); });
function filtrar(){
  const asigs = new Set([...document.querySelectorAll('.asig:checked')].map(e => e.value));
  const temas = document.getElementById('temas').checked, q = document.getElementById('buscar').value.toLowerCase();
  nodos.update(DATOS.nodos.map(n => ({id: n.id, hidden: (n.asignatura && !asigs.has(n.asignatura)) ||
    (!temas && n.tipo === 'Tema') || (q && !n.titulo.toLowerCase().includes(q) && n.tipo !== 'Practica' && q.length > 2)})));
}
document.querySelectorAll('input').forEach(e => e.addEventListener('input', filtrar));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
red.on('click', p => {
  if (!p.nodes.length) return; const n = nodos.get(p.nodes[0]);
  const vec = red.getConnectedNodes(n.id).map(i => nodos.get(i)).filter(Boolean);
  document.getElementById('detalle').innerHTML = `<h3>${esc(n.titulo)}</h3><p class="muted">${esc(n.tipo)} · ${esc(n.asignatura || 'transversal')}${n.estado ? ' · prerrequisito ' + esc(n.estado) : ''}</p>
    <p>${esc(n.detalle)}</p>${n.fuente ? `<p class="muted">Fuente: ${esc(n.fuente)}</p>` : ''}
    <p><b>Conectado con (${vec.length})</b></p><ul>${vec.slice(0, 40).map(v => `<li>${esc(v.titulo)}</li>`).join('')}</ul>
    <p class="muted">${esc(n.id)}</p>`;
});
