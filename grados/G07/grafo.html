ra del ADN", "detalle": "Doble hélice de nucleótidos con bases complementarias (A-T, C-G) unidas por enlaces de hidrógeno débiles entre cadenas.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/estructuras-celulares-basicas", "label": "Estructuras celulares básicas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Estructuras celulares básicas", "detalle": "Membrana, citoplasma, núcleo, mitocondrias, cloroplastos, pared y vacuolas cumplen funciones específicas dentro de la célula.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/evidencias-de-la-evolucion", "label": "Evidencias de la evolución", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Evidencias de la evolución", "detalle": "Fósiles, anatomía comparada, embriología y genómica comparada muestran que las especies cambian y comparten ancestros comunes.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/factores-bioticos-y-abioticos", "label": "Factores bióticos y abióticos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Factores bióticos y abióticos", "detalle": "Componentes vivos e inertes de un ecosistema, como clima, suelo, agua y luz, que determinan qué organismos pueden habitarlo.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/factores-limitantes-de-poblaciones", "label": "Factores limitantes de las poblaciones", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Factores limitantes de las poblaciones", "detalle": "Depredadores, alimento, agua, espacio y enfermedades limitan el tamaño de una población y el equilibrio entre poblaciones.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/filogenia-y-parentesco-evolutivo", "label": "Filogenia y parentesco evolutivo", "tipo": "Concepto", "asignatura":   nodes: {font: {size: 12, face: 'Arial'}}, interaction: {hover: true}});
function filtrar(){
  const asigs = new Set([...document.querySelectorAll('.asig:checked')].map(e => e.value));
  const temas = document.getElementById('temas').checked, q = document.getElementById('buscar').value.toLowerCase();
  nodos.update(DATOS.nodos.map(n => ({id: n.id, hidden: (n.asignatura && !asigs.has(n.asignatura)) ||

}
document.querySelectorAll('input').forEach(e => e.addEventListener('input', filtrar));

red.on('click', p => {
  if (!p.nodes.length) return; const n = nodos.get(p.nodes[0]);

  document.getElementById('detalle').innerHTML = `<h3>${esc(n.titulo)}</h3><p class="muted">${esc(n.tipo)} · ${esc(n.asignatura || 'transversal')}${n.estado ? ' · prerrequisito ' + esc(n.estado) : ''}</p>
