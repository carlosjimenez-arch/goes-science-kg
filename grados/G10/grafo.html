ados.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/difusion-y-osmosis", "label": "Difusión y ósmosis", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Difusión y ósmosis", "detalle": "Movimiento pasivo de sustancias a favor de su gradiente de concentración; la ósmosis es la difusión de agua a través de membranas.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/ecosistemas-acuaticos-y-marinos", "label": "Ecosistemas acuáticos y marinos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Ecosistemas acuáticos y marinos", "detalle": "Ríos, lagos, manglares, arrecifes y océano, con zonas y organismos determinados por luz, salinidad, profundidad y corrientes.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/energia-de-los-alimentos-y-balance-energetico", "label": "Energía de los alimentos y balance energ…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Energía de los alimentos y balance energético", "detalle": "Los alimentos aportan energía (kcal); su balance con el gasto metabólico y la actividad física determina el estado nutricional.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/enfermedades-infecciosas-y-no-infecciosas", "label": "Enfermedades infecciosas y no infecciosa…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Enfermedades infecciosas y no infecciosas", "detalle": "Las infecciosas las causa un patógeno y se transmiten entre hospederos; las genéticas o del estilo de vida no son contagiosas.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/enzimas", "label": "Enzimas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Enzimas", "detalle": "Proteínas catalizadoras específicas cuya actividad depende de temperatura, pH, inhibidores y concentración de sustrato y productos.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/estructura-del-adn", "label": "Estructura del ADN", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Estructura del ADN", "detalle": "Doble hélice de nucleótidos con bases complementarias (A-T, C-G) unidas por enlaces de hidrógeno débiles entre cadenas.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/estructuras-celulares-basicas", "label": "Estructuras celulares básicas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Estructuras celulares básicas", "detalle": "Membrana, citoplasma, núcleo, mitocondrias, cloroplastos, pared y vacuolas cumplen funciones específicas dentro de la célula.", "fuente": "", "estado": "ausente", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/estructuras-del-cuerpo-y-su-funcion", "label": "Estructuras del cuerpo animal y su funci…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Estructuras del cuerpo animal y su función", "detalle": "Piel, huesos, músculos, corazón, pulmones y estómago cumplen funciones específicas de protección, sostén, movimiento, circulación, respiración y digestión.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/eutrofizacion", "label": "Eutrofización", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Eutrofización", "detalle": "El exceso de nitrógeno y fósforo en el agua causa proliferación de algas, agotamiento de oxígeno y muerte de organismos acuáticos.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/evidencias-de-la-evolucion", "label": "Evidencias de la evolución", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Evidencias de la evolución", "detalle": "Fósiles, anatomía comparada, embriología y genómica comparada muestran que las especies cambian y comparten ancestros comunes.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/factores-bioticos-y-abioticos", "label": "Factores bióticos y abióticos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Factores bióticos y abióticos", "detalle": "Componentes vivos e inertes de un ecosistema, como clima, suelo, agua y luz, que determinan qué organismos pueden habitarlo.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/fases-de-la-fotosintesis", "label": "Fases de la fotosíntesis y ciclo de Calv…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Fases de la fotosíntesis y ciclo de Calvin", "detalle": "Fase luminosa en tilacoides que produce ATP y NADPH, y ciclo de Calvin en el estroma que fija CO2 en azúcares.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/fermentacion-y-respiracion-anaerobia", "label": "Fermentación y respiración anaerobia", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Fermentación y respiración anaerobia", "detalle": "Obtención de energía sin oxígeno que produce poco ATP y genera productos como ácido láctico o etanol.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/filogenia-y-parentesco-evolutivo", "label": "Filogenia y parentesco evolutivo", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Filogenia y parentesco evolutivo", "detalle": "Los sistemas de clasificación y los árboles filogenéticos representan relaciones de ancestro común entre grupos de organismos.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/flujo-de-energia-y-piramides", "label": "Flujo de energía y pirámides ecológicas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Flujo de energía y pirámides ecológicas", "detalle": "La energía solar pasa de productores a consumidores, perdiéndose c e ofrecen una ruta de menor energía de activación sin consumirse; incluye catálisis homogénea, heterogénea y enzimática.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/ciencia-de-materiales", "label": "Metales, cerámicas y materiales compuest…", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Metales, cerámicas y materiales compuestos", "detalle": "Relación entre estructura atómica y propiedades eléctricas, ópticas, térmicas y mecánicas de aleaciones, aceros, cerámicas y compuestos reforzados.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/combustion", "label": "Combustión", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Combustión", "detalle": "Reacción de un combustible con oxígeno que libera energía como calor y luz; puede ser completa o incompleta según los productos.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/composicion-porcentual-y-formulas", "label": "Composición porcentual y fórmulas empíri…", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Composición porcentual y fórmulas empírica y molecular", "detalle": "Porcentaje en masa de cada elemento en un compuesto y su uso para deducir la fórmula empírica y la molecular.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/concentracion-de-disoluciones", "label": "Soluto, disolvente y concentración", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Soluto, disolvente y concentración", "detalle": "Cantidad de soluto en cierta cantidad de disolución, expresada cualitativamente o en porcentaje, g/L o ppm.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/configuracion-electronica", "label": "Configuración electrónica por orbitales", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Configuración electrónica por orbitales", "detalle": "Distribución de los electrones en subniveles y orbitales (s, p, d, f) según el principio de Aufbau, la exclusión de Pauli y la regla de Hund; explica los bloques de la tabla periódica.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/conservacion-de-la-masa", "label": "Conservación de la masa", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Conservación de la masa", "detalle": "En una reacción los átomos se reordenan sin crearse ni destruirse, por lo que la masa total se conserva.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/constante-de-equilibrio", "label": "Constante de equilibrio", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Constante de equilibrio", "detalle": "K, por la ley de acción de masas, indica la posición del equilibrio; comparada con Q predice el sentido del cambio.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/cromatografia", "label": "Cromatografía", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Cromatografía", "detalle": "Técnica que separa componentes por su interacción diferencial con una fase móvil y una estacionaria; determina composición y pureza.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/densidad-y-flotacion", "label": "Densidad y flotación", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Densidad y flotación", "detalle": "La densidad relaciona masa y volumen de un material; determina si un objeto flota o se hunde en un líquido.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/diagramas-de-fases", "label": "Diagramas de fases", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Diagramas de fases", "detalle": "Gráfico presión-temperatura que muestra las condiciones de equilibrio entre fases, con punto triple y punto crítico.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/difusion-efusion-y-gases-reales", "label": "Mezclas de gases, difusión y gases reale…", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Mezclas de gases, difusión y gases reales", "detalle": "Ley de Dalton de presiones parciales, ley de Graham de difusión y desviaciones de los gases reales (van der Waals).", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/disolucion-y-su-rapidez", "label": "Disolución y rapidez de disolución", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Disolución y rapidez de disolución", "detalle": "Un sólido se disuelve en un líquido como el agua; temperatura, agitación y superficie de contacto aumentan su rapidez.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/disoluciones-coloides-y-suspensiones", "label": "Disoluciones, coloides y suspensiones", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Disoluciones, coloides y suspensiones", "detalle": "Dispersiones que se distinguen por el tamaño de partícula dispersa: las disoluciones son homogéneas; coloides muestran efecto Tyndall; suspensiones sedimentan.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/distribucion-electronica-por-niveles", "label": "Distribución electrónica por niveles (mo…", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Distribución electrónica por niveles (modelo de capas)", "detalle": "Electrones ordenados en capas o niveles de energía (2, 8, 8…) según el modelo de Bohr; la capa externa (de valencia) explica el grupo, el período y la reactividad.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/ecuacion-de-gases-ideales-y-volumen-molar", "label": "Ecuación de los gases ideales y volumen …", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Ecuación de los gases ideales y volumen molar", "detalle": "PV = nRT relaciona cantidad, presión, volumen y temperatura; a condiciones normales un mol de gas ocupa un volumen fijo.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/ecuacion-quimica-y-balanceo", "label": "Ecuación química y su balanceo", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Ecuación química y su balanceo", "detalle": "Representación simbólica de una reacción con reactivos, productos, estados y coeficientes que igualan los átomos de cada elemento.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/el-carbono-y-las-moleculas-organicas", "label": "El carbono y las moléculas orgánicas", "tipo": "Concepto", "asignatura": "quimica", "titulo": "El carbono y las moléculas orgánicas", "detalle": "El carbono forma cuatro enlaces y cadenas con hidrógeno y otros átomos, generando esqueletos hidrocarbonados de gran diversidad.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/electrolitos", "label": "Electrolitos fuertes y débiles", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Electrolitos fuertes y débiles", "detalle": "Sustancias que en disolución o fundidas producen iones y conducen electricidad; se disocian total o parcialmente.", "fuente": "", "estado": "", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/electronegatividad-y-polaridad-de-enlace", "label": "Electronegatividad y polaridad de enlace", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Electronegatividad y polaridad de enlace", "detalle": "La diferencia de electronegatividad entre átomos enlazados genera enlaces no polares, polares o iónicos con momento dipolar de enlace.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/electrones-de cepto", "asignatura": "quimica", "titulo": "Estequiometría", "detalle": "Cálculo de cantidades de reactivos y productos a partir de los coeficientes de la ecuación balanceada y el mol.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/estereoquimica", "label": "Estereoquímica y quiralidad", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Estereoquímica y quiralidad", "detalle": "Isómeros con igual conectividad y distinta disposición espacial: geométricos cis-trans y enantiómeros de moléculas quirales.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/esterificacion-e-hidrolisis", "label": "Esterificación e hidrólisis", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Esterificación e hidrólisis", "detalle": "Ácidos carboxílicos y alcoholes forman ésteres por condensación; ésteres y amidas se hidrolizan en medio ácido o básico.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:quimica/estructuras-de-lewis", "label": "Notación y estructuras de Lewis", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Notación y estructuras de Lewis", "detalle": "Representación de electrones de valencia como puntos y de pares compartidos como líneas para modelar enlaces y pares libres.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/fuerzas-intermoleculares", "label": "Fuerzas intermoleculares", "tipo": "Concepto", "asignatura": "quimica", "titulo": "Fuerzas intermoleculares", "detalle": "Atracciones entre moléculas: dispersión de London, dipolo-dipolo y puentes de hidrógeno, cuya intensidad depende de geometría y polaridad.", "fuente": "", "estado": "previo", "shape": "box", "color": "#8E24AA", "size": 14}, {"id": "CON:quimica/fuerzas-intermoleculares-y-propiedades-fisicas", "label": "Fuerzas intermoleculares y propiedades f…", "tipo": "Concepto", // vis-network dibuja en canvas: los colores de texto se fijan aquí (no toma las variables CSS).
const oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
const tinta = oscuro ? '#ececea' : '#1d1d1b';
DATOS.nodos.forEach(n => {
  n.font = n.shape === 'box' ? {color: '#ffffff', size: 13, face: 'Arial'} : {color: tinta, size: 11, face: 'Arial'};
  if (n.shape === 'box') n.margin = 6;
  n.hidden = n.tipo === 'Tema';  // vista inicial: mapa de conceptos y prácticas
});
const nodos = new vis.DataSet(DATOS.nodos), aristas = new vis.DataSet(DATOS.aristas);
const red = new vis.Network(document.getElementById('red'), {nodes: nodos, edges: aristas}, {
  physics: {solver: 'forceAtlas2Based', forceAtlas2Based: {gravitationalConstant: -90, springLength: 140},
            stabilization: {iterations: 400}},
  layout: {improvedLayout: false},
  nodes: {scaling: {label: {drawThreshold: 3}}}, interaction: {hover: true, tooltipDelay: 150}});
red.once('stabilizationIterationsDone', () => { red.setOptions({physics: false}); red.fit(); });
function filtrar(){
  const asigs = new Set([...document.querySelectorAll('.asig:checked')].map(e => e.value));
  const temas = document.getElementById('temas').checked, q = document.getElementById('buscar').value.toLowerCase();
  nodos.update(DATOS.nodos.map(n => ({id: n.id, hidden: (n.asignatura && !asigs.has(n.asignatura)) ||
    (!temas && n.tipo === 'Tema') || (q && !n.titulo.toLowerCase().includes(q) && n.tipo !== 'Practica' && q.length > 2)})));
}
document.querySelectorAll('input').forEach(e => e.addEventListener('input', filtrar));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
red.on('click', p => {
  if (!p.nodes.length) return; const n = nodos.get(p.nodes[0]);
  const vec = red.getConnectedNodes(n.id).map(i => nodos.get(i)).filter(Boolean);
  document.getElementById('detalle').innerHTML = `<h3>${esc(n.titulo)}</h3><p class="muted">${esc(n.tipo)} · ${esc(n.asignatura || 'transversal')}${n.estado ? ' · prerrequisito ' + esc(n.estado) : ''}</p>
    <p>${esc(n.detalle)}</p>${n.fuente ? `<p class="muted">Fuente: ${esc(n.fuente)}</p>` : ''}
    <p><b>Conectado con (${vec.length})</b></p><ul>${vec.slice(0, 40).map(v => `<li>${esc(v.titulo)}</li>`).join('')}</ul>
    <p class="muted">${esc(n.id)}</p>`;
});
