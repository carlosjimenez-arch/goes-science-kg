 14}, {"id": "CON:biologia/celula-procariota-y-eucariota", "label": "Célula procariota y eucariota", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Célula procariota y eucariota", "detalle": "Las procariotas carecen de núcleo y organelos membranosos y tienen cromosoma circular; ambas comparten origen evolutivo común.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/ciclo-de-vida-de-las-plantas", "label": "Ciclo de vida de las plantas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Ciclo de vida de las plantas", "detalle": "Etapas de germinación, crecimiento, floración, polinización, formación del fruto y dispersión de semillas en plantas con flor.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/ciclo-de-vida-de-los-animales", "label": "Ciclo de vida de los animales", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Ciclo de vida de los animales", "detalle": "Etapas de nacimiento, crecimiento, reproducción y muerte; algunos animales, como ranas y mariposas, presentan metamorfosis.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/diferenciacion-y-especializacion-celular", "label": "Diferenciación y especialización celular", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Diferenciación y especialización celular", "detalle": "Proceso por el que células con el mismo genoma adquieren estructuras y funciones distintas para formar tejidos especializados.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/difusion-y-osmosis", "label": "Difusión y ósmosis", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Difusión y ósmosis", "detalle": "Movimiento pasivo de sustancias a favor de su gradiente de concentración; la ósmosis es la difusión de agua a través de membranas.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/enzimas", "label": "Enzimas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Enzimas", "detalle": "Proteínas catalizadoras específicas cuya actividad depende de temperatura, pH, inhibidores y concentración de sustrato y productos.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/estructura-del-adn", "label": "Estructura del ADN", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Estructura del ADN", "detalle": "Doble hélice de nucleótidos con bases complementarias (A-T, C-G) unidas por enlaces de hidrógeno débiles entre cadenas.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/estructuras-celulares-basicas", "label": "Estructuras celulares básicas", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Estructuras celulares básicas", "detalle": "Membrana, citoplasma, núcleo, mitocondrias, cloroplastos, pared y vacuolas cumplen funciones específicas dentro de la célula.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/fases-de-la-fotosintesis", "label": "Fases de la fotosíntesis y ciclo de Calv…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Fases de la fotosíntesis y ciclo de Calvin", "detalle": "Fase luminosa en tilacoides que produce ATP y NADPH, y ciclo de Calvin en el estroma que fija CO2 en azúcares.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/fecundacion-y-desarrollo-embrionario", "label": "Fecundación y desarrollo embrionario", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Fecundación y desarrollo embrionario", "detalle": "Unión de gametos que forma un cigoto, el cual se divide y diferencia en embrión y luego en un nuevo organismo.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:b itulo": "Membrana celular", "detalle": "Bicapa de fosfolípidos con proteínas que delimita la célula y regula el paso de gases, nutrientes y desechos.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/microorganismos", "label": "Microorganismos", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Microorganismos", "detalle": "Seres vivos microscópicos, como bacterias, hongos microscópicos y protistas, que pueden ser beneficiosos o causar enfermedades.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/mitosis-y-ciclo-celular", "label": "Mitosis y ciclo celular", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Mitosis y ciclo celular", "detalle": "División del núcleo que produce dos células hijas genéticamente idénticas; permite el crecimiento, la reparación y la reproducción asexual.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/niveles-de-organizacion", "label": "Niveles de organización de los seres viv…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Niveles de organización de los seres vivos", "detalle": "Las células especializadas forman tejidos, los tejidos forman órganos y los órganos forman sistemas en organismos multicelulares.", "fuente": "", "estado": "previo", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/nutricion-autotrofa-y-heterotrofa", "label": "Nutrición autótrofa y heterótrofa", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Nutrición autótrofa y heterótrofa", "detalle": "Las plantas fabrican su alimento con luz, aire y agua; los animales obtienen alimento comiendo plantas u otros animales.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/nutrientes-y-sus-funciones", "label": "Nutrientes y sus funciones", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Nutrientes y sus funciones", "detalle": "Carbohidratos, lípidos, proteínas, vitaminas, minerales y agua aportan energía, materiales de construcción y regulación al organismo.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/organelos-de-la-celula-eucariota", "label": "Organelos de la célula eucariota", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Organelos de la célula eucariota", "detalle": "Retículo endoplasmático, aparato de Golgi, lisosomas, mitocondrias y cloroplastos compartimentan síntesis, energía y eliminación de desechos.", "fuente": "", "estado": "", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/partes-de-la-planta-y-sus-funciones", "label": "Partes de la planta y sus funciones", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Partes de la planta y sus funciones", "detalle": "Raíz, tallo, hoja, flor, fruto y semilla cumplen funciones de fijación, transporte, fabricación de alimento y reproducción.", "fuente": "", "estado": "previo", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/proteinas-estructura-y-funcion", "label": "Proteínas: estructura y función", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Proteínas: estructura y función", "detalle": "Cadenas de aminoácidos plegadas cuya forma determina funciones estructurales, de transporte, de defensa, de señalización y enzimáticas.", "fuente": "", "estado": "posterior", "shape": "box", "color": "#9E9E9E", "size": 14}, {"id": "CON:biologia/reproduccion-de-plantas-con-flor", "label": "Reproducción sexual de las plantas con f…", "tipo": "Concepto", "asignatura": "biologia", "titulo": "Reproducción sexual de las plantas con flor", "detalle": "Polinización, fecundación en el ovario de la flor y formación de semilla y fruto en las angiospermas.", "fuente": "", "estado": "mismo_grado", "shape": "box", "color": "#2E7D32", "size": 14}, {"id": "CON:biologia/reproduccion-humana-y-p   if (!p.nodes.length) return; const n = nodos.get(p.nodes[0]);
  const vec = red.getConnectedNodes(n.id).map(i => nodos.get(i)).filter(Boolean);
  document.getElementById('detalle').innerHTML = `<h3>${esc(n.titulo)}</h3><p class="muted">${esc(n.tipo)} · ${esc(n.asignatura || 'transversal')}${n.estado ? ' · prerrequisito ' + esc(n.estado) : ''}</p>
    <p>${esc(n.detalle)}</p>${n.fuente ? `<p class="muted">Fuente: ${esc(n.fuente)}</p>` : ''}
    <p><b>Conectado con (${vec.length})</b></p><ul>${vec.slice(0, 40).map(v => `<li>${esc(v.titulo)}</li>`).join('')}</ul>
    <p class="muted">${esc(n.id)}</p>`;
});
</script></body></html>
